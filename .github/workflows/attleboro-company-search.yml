name: Attleboro Sunrun Giga records and original contracts
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/attleboro-company-search.yml']
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          pip -q install playwright pypdf
          python -m playwright install chromium
      - run: |
          mkdir -p output
          python - <<'PY'
          import asyncio,json,os,re,hashlib
          from playwright.async_api import async_playwright
          from pypdf import PdfReader
          def addr(s):return re.sub(r'[^a-z0-9]','',s.lower().replace('street','st').replace('road','rd').replace('drive','dr').replace('avenue','ave'))
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              c=await b.new_context(accept_downloads=True)
              pg=await c.new_page()
              pg.set_default_timeout(9000)
              await pg.goto('https://permiteyes.us/attleboro/publicview.php',wait_until='domcontentloaded')
              await pg.wait_for_timeout(3500)
              ap=pg.locator('input[name=applicant_name]:visible').first
              site=pg.locator('input[name=site_add]:visible,input[name=site_address]:visible').first
              async def search(inp,q):
                await inp.fill(q);await inp.dispatch_event('keyup');await inp.press('Enter');await pg.wait_for_timeout(1800)
              async def collect():
                allrows={}
                for k in range(35):
                  records=await pg.locator('tr:has(a.view_app):visible').evaluate_all("es=>es.map(e=>({cells:[...e.querySelectorAll('td')].map(x=>x.textContent.trim()),id:e.querySelector('a.view_app').dataset.id,attachment:e.querySelector('a.Attachmentclass')?.title||''}))")
                  for r in records:allrows[r['id']]=r
                  n=pg.locator('.paginate_button.next:visible:not(.disabled)').first
                  if not await n.count():break
                  await n.click();await pg.wait_for_timeout(600)
                return list(allrows.values())
              found={}
              for q in ['giga','espigar','sunrun','sun run','vivint']:
                await search(ap,q)
                rr=await collect();found[q]=rr
                print('COUNT',q,len(rr),flush=True)
                for r in rr:print('RECORD',q,json.dumps(r),flush=True)
              with open('output/permit_index.json','w') as f:json.dump(found,f,indent=2)
              giga={r['id']:r for q in ['giga','espigar'] for r in found[q]}
              sun={r['id']:r for q in ['sunrun','sun run'] for r in found[q]}
              # Attleboro table observed: site address index 9, applicant index 10, application type index 12.
              groups={}
              for typ,rs in [('GIGA_CANDIDATE',giga),('SUNRUN',sun)]:
                for r in rs.values():
                  cells=r['cells']
                  if len(cells)<14:continue
                  key=addr(cells[9])
                  if not key:continue
                  groups.setdefault(key,{'address':cells[9],'GIGA_CANDIDATE':[],'SUNRUN':[]})[typ].append(r)
              pairs=[g for g in groups.values() if g['GIGA_CANDIDATE'] and g['SUNRUN']]
              print('MATCHED_ADDRESSES',json.dumps(pairs),flush=True)
              # For Giga candidate properties, also search by street address to catch alternative solar applicant names.
              await search(ap,'')
              expanded=[]
              for g in [x for x in groups.values() if x['GIGA_CANDIDATE']][:20]:
                await search(site,g['address'])
                rr=await collect()
                print('ADDRESS_RECORDS',g['address'],json.dumps(rr),flush=True)
                expanded.append({'address':g['address'],'records':rr})
              with open('output/address_cross_reference.json','w') as f:json.dump(expanded,f,indent=2)
              targets=[]
              for g in pairs:
                targets.append(g)
              if not targets:
                targets=[g for g in groups.values() if g['GIGA_CANDIDATE']][:2]
              if not targets:
                targets=[g for g in groups.values() if g['SUNRUN']][:2]
              for g in targets[:3]:
                await search(site,g['address'])
                rr=await collect()
                for r in rr:
                  if r['id'] not in giga and r['id'] not in sun:continue
                  if 'present' not in r['attachment'].lower():continue
                  a=pg.locator('a.Attachmentclass[data-id="'+r['id']+'"]:visible')
                  if not await a.count():continue
                  await a.first.click()
                  m=pg.locator('#AttachmentModal')
                  await pg.wait_for_timeout(1700)
                  links=m.locator('a[data-href][data-download]:visible')
                  names=await links.all_text_contents()
                  print('ATTACHMENTS',g['address'],r['id'],json.dumps(names),flush=True)
                  for i,name in enumerate(names):
                    if not name.strip().lower().endswith('.pdf') or not re.search(r'contract|agreement|proposal|signed|authoriz|signature|docusign|affidavit|estimate|application|change.order',name,re.I):continue
                    try:
                      async with pg.expect_download(timeout=12000) as d:await links.nth(i).click()
                      dl=await d.value
                      f='output/'+r['id']+'_'+re.sub(r'[^a-zA-Z0-9._-]','_',dl.suggested_filename)
                      await dl.save_as(f)
                      data=open(f,'rb').read();assert data.startswith(b'%PDF-')
                      reader=PdfReader(f)
                      print('VERIFIED',f,len(data),len(reader.pages),hashlib.sha256(data).hexdigest(),flush=True)
                    except Exception as e:print('DOWNLOAD_ERROR',str(e)[:160],flush=True)
                  close=m.locator('[data-dismiss=modal]:visible').first
                  if await close.count():await close.click()
                  await pg.wait_for_timeout(350)
              await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attleboro-giga-sunrun-evidence
          path: output/
          if-no-files-found: error
