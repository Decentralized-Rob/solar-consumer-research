name: Retrieve roofing contract for Zoe Haley Caroline job
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/solar-agreement-consultants-eyes.yml']
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: pip -q install requests pymupdf
      - run: |
          python -u - <<'PY'
          import requests,json,re,hashlib
          from pathlib import Path
          from urllib.parse import quote
          import fitz
          OUT=Path("zoe_caroline_roof");OUT.mkdir(exist_ok=True)
          BASE="https://permiteyes.us/bellingham/"
          s=requests.Session();s.get(BASE+"publicview.php",timeout=30)
          u=BASE+"controller/publicattachments_controller.php"
          r=s.post(u,data={"action":"displayAttach","ApplicationId":"70b34e47-da1b-11f1-b346-12716692ccab"},timeout=30);r.raise_for_status()
          j=r.json();aa=j.get("Attachments") or []
          (OUT/"attachment_listing.json").write_text(json.dumps(j,indent=2))
          manifest=[]
          for a in aa:
           name=a.get("FileName","");print("ATTACHMENT",name,flush=True)
           if not name.lower().endswith(".pdf") or re.search(r"insurance|workers|compensation|debris|disposal|dumpster|affidavit|licen[cs]e|csl|plans|drawing|specification",name,re.I):continue
           path=a["AttachmentPath"] if a.get("ID_import") not in [None,"","0",0] else "/mys3bucket/permiteyes.us/attachments/bellingham/building/"+a["AttachmentPath"]
           url="https://permiteyes.us/readfiles2.php?file="+quote(path)
           rr=s.get(url,timeout=45);rr.raise_for_status();b=rr.content
           if not b.startswith(b"%PDF"):continue
           d=fitz.open(stream=b,filetype="pdf");text="\n".join(p.get_text() for p in d)
           fp=OUT/re.sub("[^A-Za-z0-9_.-]","_",name);fp.write_bytes(b)
           manifest.append({"name":name,"url":url,"pages":len(d),"sha256":hashlib.sha256(b).hexdigest(),"text":text,"file":fp.name})
           print("SAVED",fp.name,len(d),flush=True)
          (OUT/"manifest.json").write_text(json.dumps(manifest,indent=2))
          print("RESULT",len(aa),len(manifest),flush=True)
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zoe-caroline-roof
          path: zoe_caroline_roof/
          retention-days: 7
