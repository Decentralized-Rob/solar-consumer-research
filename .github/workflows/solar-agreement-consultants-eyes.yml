name: Analyze Capital Roofing Sunrun pair
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/solar-agreement-consultants-eyes.yml']
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: pip -q install requests pymupdf
      - run: |
          python -u - <<'PY'
          import requests,json,re,hashlib,base64
          from pathlib import Path
          from urllib.parse import quote
          import fitz
          BASE="https://permiteyes.us/bellingham/"
          OUT=Path("capital_pair_analysis");OUT.mkdir(exist_ok=True)
          S=requests.Session();S.get(BASE+"publicview.php",timeout=30)
          targets=[("Candace_roof","30eacf0e-b659-11ef-a76a-12716692ccab"),("Candace_solar_2024","f25a2398-b307-11ef-a76a-12716692ccab"),("Candace_solar_2026","a307208b-3753-11f1-b76b-12716692ccab"),("Lakeshore_roof","8ed1688d-f3a4-11ea-8656-122947997c8e"),("Lakeshore_electric","d61e1e0f-cce7-11ea-95e2-122947997c8e")]
          results=[]
          for label,uuid in targets:
           j=S.post(BASE+"controller/publicattachments_controller.php",data={"action":"displayAttach","ApplicationId":uuid},timeout=40).json();aa=j.get("Attachments") or []
           print("LISTING",label,json.dumps(aa),flush=True)
           for a in aa:
            name=a.get("FileName","")
            if not name.lower().endswith(".pdf") or not re.search(r"contract|agreement|customer|\bcap\b|robert|norton",name,re.I):continue
            path=a["AttachmentPath"] if a.get("ID_import") not in [None,"","0",0] else "/mys3bucket/permiteyes.us/attachments/bellingham/building/"+a["AttachmentPath"]
            url="https://permiteyes.us/readfiles2.php?file="+quote(path)
            try:
             q=S.get(url,timeout=50);q.raise_for_status();b=q.content
             if not b.startswith(b"%PDF"):continue
             d=fitz.open(stream=b,filetype="pdf");text="\n".join(f"\nPAGE {i+1}\n"+p.get_text() for i,p in enumerate(d))
             fn=label+"_"+re.sub("[^A-Za-z0-9_.-]","_",name);(OUT/fn).write_bytes(b)
             doc={"label":label,"name":name,"url":url,"file":fn,"pages":len(d),"sha256":hashlib.sha256(b).hexdigest(),"text":text}
             results.append(doc);print("DOC",json.dumps(doc),flush=True)
             if label=="Candace_roof":
              pix=d[-1].get_pixmap(matrix=fitz.Matrix(1.5,1.5));print("PAGE_IMAGE",base64.b64encode(pix.tobytes("png")).decode(),flush=True)
            except Exception as e:print("ERROR",label,name,str(e),flush=True)
          (OUT/"manifest.json").write_text(json.dumps(results,indent=2))
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capital-pair-analysis
          path: capital_pair_analysis/
          retention-days: 30
