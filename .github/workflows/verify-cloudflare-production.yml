name: Verify Cloudflare production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 1f679a0e8989a1ba29030ff449b77fd3
      WORKER_NAME: solar-consumer-research
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - name: Verify token is configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_BUILDS_API_TOKEN repository secret."
            exit 1
          fi

      - name: Match Cloudflare production build to main
        shell: bash
        run: |
          set -euo pipefail

          api() {
            curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 20 \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4$1"
          }

          scripts="$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          worker_tag="$(
            jq -r --arg worker "$WORKER_NAME" '
              .result
              | if type == "array" then .
                elif type == "object" and has("items") then .items
                elif type == "object" and has("scripts") then .scripts
                else [] end
              | .[] | select(.id == $worker) | .tag
            ' <<<"$scripts"
          )"

          if [ -z "$worker_tag" ] || [ "$worker_tag" = "null" ]; then
            echo "::error::Cloudflare Worker $WORKER_NAME was not found in the configured account."
            exit 1
          fi

          for attempt in $(seq 1 30); do
            builds="$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/builds/workers/$worker_tag/builds")"
            matching_build="$(
              jq -c --arg sha "$GITHUB_SHA" '
                .result
                | if type == "array" then .
                  elif type == "object" and has("builds") then .builds
                  elif type == "object" and has("items") then .items
                  else [] end
                | map(select(.build_trigger_metadata.commit_hash == $sha))
                | first // empty
              ' <<<"$builds"
            )"

            if [ -n "$matching_build" ]; then
              outcome="$(jq -r '.build_outcome // empty' <<<"$matching_build")"
              build_uuid="$(jq -r '.build_uuid // empty' <<<"$matching_build")"

              if [ "$outcome" = "success" ]; then
                status_code="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output /dev/null --write-out "%{http_code}" https://solarcomplaint.com/states/maine)"
                if [ "$status_code" != "200" ]; then
                  echo "::error::Cloudflare build succeeded, but solarcomplaint.com/states/maine returned HTTP $status_code."
                  exit 1
                fi

                {
                  echo "## Cloudflare production verified"
                  echo
                  echo "- Worker: \`$WORKER_NAME\`"
                  echo "- Build: \`$build_uuid\`"
                  echo "- Deployed commit: \`$GITHUB_SHA\`"
                  echo "- Public route: \`200 OK\`"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi

              if [ -n "$outcome" ] && [ "$outcome" != "success" ]; then
                echo "::error::Cloudflare build $build_uuid for $GITHUB_SHA finished with outcome: $outcome."
                exit 1
              fi
            fi

            echo "Attempt $attempt/30: Cloudflare has not completed a successful build for $GITHUB_SHA yet."
            sleep 10
          done

          echo "::error::Cloudflare did not complete a build for $GITHUB_SHA within five minutes."
          exit 1
