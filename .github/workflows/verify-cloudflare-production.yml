name: Verify Cloudflare production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 1f679a0e8989a1ba29030ff449b77fd3
      WORKER_NAME: solar-consumer-research
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - name: Verify token is configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_BUILDS_API_TOKEN repository secret."
            exit 1
          fi

      - name: Match active Cloudflare production build to main
        shell: bash
        run: |
          set -euo pipefail

          api() {
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4$1"
          }

          scripts="$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          worker_tag="$(jq -r --arg worker "$WORKER_NAME" '.result[] | select(.id == $worker) | .tag' <<<"$scripts")"

          if [ -z "$worker_tag" ] || [ "$worker_tag" = "null" ]; then
            echo "::error::Cloudflare Worker $WORKER_NAME was not found in the configured account."
            exit 1
          fi

          for attempt in $(seq 1 30); do
            deployments="$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments")"
            version_id="$(jq -r '.result.deployments[0].versions[0].version_id // empty' <<<"$deployments")"

            if [ -n "$version_id" ]; then
              builds="$(api "/accounts/$CLOUDFLARE_ACCOUNT_ID/builds/builds?version_ids=$version_id")"
              deployed_sha="$(jq -r '.result.builds[0].build_trigger_metadata.commit_hash // empty' <<<"$builds")"

              if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
                {
                  echo "## Cloudflare production verified"
                  echo
                  echo "- Worker: \`$WORKER_NAME\`"
                  echo "- Active version: \`$version_id\`"
                  echo "- Deployed commit: \`$deployed_sha\`"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi

              echo "Attempt $attempt/30: active Cloudflare commit is ${deployed_sha:-unknown}; waiting for $GITHUB_SHA."
            else
              echo "Attempt $attempt/30: Cloudflare has not reported an active deployment version yet."
            fi

            sleep 10
          done

          echo "::error::Cloudflare production did not reach $GITHUB_SHA within five minutes."
          exit 1
