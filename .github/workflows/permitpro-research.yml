name: Boxborough five-year full public permit index - Giga/Sunrun
on:
  push:
    branches:
      - research/permitpro-sunrun-giga
    paths:
      - "tools/boxborough_complete_index.py"
      - ".github/workflows/permitpro-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Scan full Boxborough permit index for both names independently and test originals
        run: python -u tools/boxborough_complete_index.py
      - name: Archive independent results and verified source files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxborough-full-index-giga-sunrun-results
          path: boxborough_complete_results/
          if-no-files-found: warn
          retention-days: 2
