name: Boxborough independent company search on published permit index
on:
  push:
    branches:
      - research/permitpro-sunrun-giga
    paths:
      - "tools/boxborough_company_search.py"
      - ".github/workflows/permitpro-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Search Giga and Sunrun independently with backend
        run: python -u tools/boxborough_company_search.py
      - name: Save separated company results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxborough-giga-sunrun-separated-results
          path: boxborough_company_search/
          if-no-files-found: warn
          retention-days: 2
