name: Boylston one-town contractor lookup (Upton discovery step)
on:
  push:
    branches:
      - research/permitpro-sunrun-giga
    paths:
      - "tools/boylston_giga_candidates.py"
      - ".github/workflows/permitpro-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Identify first Giga-Sunrun matching address in Boylston only
        run: python -u tools/boylston_giga_candidates.py
      - name: Save only identified candidate metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boylston-giga-address-matches
          path: boylston_giga_candidates/
          if-no-files-found: warn
          retention-days: 1
