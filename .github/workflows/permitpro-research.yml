name: Boxborough public PermitPro search backend diagnosis
on:
  push:
    branches:
      - research/permitpro-sunrun-giga
    paths:
      - "tools/boxborough_backend_probe.py"
      - ".github/workflows/permitpro-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Capture public search request and filter schema
        run: python -u tools/boxborough_backend_probe.py
      - name: Save diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxborough-search-backend-diagnosis
          path: boxborough_backend_probe/
          if-no-files-found: warn
          retention-days: 1
