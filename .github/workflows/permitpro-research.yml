name: One property original PDFs - Upton method
on:
  push:
    branches:
      - research/permitpro-sunrun-giga
    paths:
      - "tools/holbrook_packet_test.py"
      - ".github/workflows/permitpro-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Repeat Upton permit record PDF downloads for one property
        run: python -u tools/holbrook_packet_test.py
      - name: Save original PDFs and source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holbrook-35-marion-original-permit-pdfs
          path: holbrook_35_marion_packet/
          if-no-files-found: warn
          retention-days: 1
