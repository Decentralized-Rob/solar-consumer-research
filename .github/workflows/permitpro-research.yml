name: PermitPro public document research (isolated)
on:
  push:
    branches:
      - research/permitpro-sunrun-giga
    paths:
      - "tools/permitpro_probe.py"
      - ".github/workflows/permitpro-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Probe public municipality portals (no credentials)
        run: python tools/permitpro_probe.py
      - name: Save inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permitpro-portal-probe
          path: permitpro_probe/
          if-no-files-found: warn
          retention-days: 14
