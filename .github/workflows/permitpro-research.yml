name: Boston 2025 original Sunrun Giga permit image check
on:
  push:
    branches:
      - research/permitpro-sunrun-giga
    paths:
      - "tools/boston_2025_originals.py"
      - ".github/workflows/permitpro-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Retrieve matching July 2025 permit image PDFs
        run: python -u tools/boston_2025_originals.py
      - name: Save archive captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boston-2025-originals-probe
          path: boston_originals_probe/
          if-no-files-found: warn
          retention-days: 1
