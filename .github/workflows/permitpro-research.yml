name: Upton method - One property original PDFs
on:
  push:
    branches:
      - research/permitpro-sunrun-giga
    paths:
      - "tools/boylston_barnard_packet_test.py"
      - ".github/workflows/permitpro-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Original Upton one-property record download sequence
        run: python -u tools/boylston_barnard_packet_test.py
      - name: Original scanned PDFs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boylston-23-barnard-original-permit-pdfs
          path: boylston_23_barnard_packet/
          if-no-files-found: warn
          retention-days: 1
