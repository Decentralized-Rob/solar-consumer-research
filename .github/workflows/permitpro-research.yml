name: Boxborough Giga/Sunrun independent backup UI search
on:
  push:
    branches:
      - research/permitpro-sunrun-giga
    paths:
      - "tools/boxborough_separate_ui_search.py"
      - ".github/workflows/permitpro-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boxborough:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Giga search and Sunrun search independently using Boxborough UI
        run: python -u tools/boxborough_separate_ui_search.py
      - name: Preserve separate searches and verified originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxborough-independent-giga-sunrun-backup
          path: boxborough_ui_backup/
          if-no-files-found: warn
          retention-days: 2
