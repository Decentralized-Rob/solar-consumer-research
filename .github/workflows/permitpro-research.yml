name: PermitPro public agreement discovery (isolated)
on:
  push:
    branches:
      - research/permitpro-sunrun-giga
    paths:
      - "tools/permitpro_find_ppa.py"
      - ".github/workflows/permitpro-research.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF reader and browser
        run: |
          python -m pip install --disable-pip-version-check playwright PyMuPDF requests
          python -m playwright install --with-deps chromium
      - name: Search saved Sunrun indexes for publicly available PPAs
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: python -u tools/permitpro_find_ppa.py
      - name: Save document matches only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permitpro-ppa-candidates
          path: permitpro_ppa_results/
          if-no-files-found: warn
          retention-days: 1
