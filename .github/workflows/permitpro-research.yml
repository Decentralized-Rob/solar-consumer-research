name: Boxborough PermitPro - Giga and Sunrun separate backup
on:
  push:
    branches:
      - research/permitpro-sunrun-giga
    paths:
      - "tools/boxborough_probe.py"
      - ".github/workflows/permitpro-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boxborough:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Search Boxborough Giga and Sunrun separately, then retrieve originals
        run: python -u tools/boxborough_probe.py
      - name: Save Boxborough records and verified PDF originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxborough-permitpro-originals-and-separate-searches
          path: boxborough_probe/
          if-no-files-found: warn
          retention-days: 2
