name: PermitPro 2025 signed document investigation
on:
  push:
    branches:
      - research/permitpro-sunrun-giga
    paths:
      - "tools/permitpro_new_2025.py"
      - ".github/workflows/permitpro-research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Inspect 2025 Giga Sunrun originals
        run: python -u tools/permitpro_new_2025.py
      - name: Save discovered original documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permitpro-2025-giga-sunrun-originals
          path: permitpro_new_2025/
          if-no-files-found: warn
          retention-days: 1
