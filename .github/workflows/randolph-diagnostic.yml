name: Randolph portal diagnostics
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/randolph-diagnostic.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          pip -q install playwright pypdf
          python -m playwright install chromium
      - run: |
          mkdir -p output
          python - <<'PY'
          import asyncio,re,os,hashlib
          from playwright.async_api import async_playwright
          from pypdf import PdfReader
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              c=await b.new_context(accept_downloads=True)
              pg=await c.new_page()
              r=await pg.goto('https://permiteyes.us/randolph/publicview.php',wait_until='domcontentloaded',timeout=45000)
              await pg.wait_for_timeout(5000)
              print('URL',pg.url,'STATUS',r.status,'TITLE',await pg.title(),flush=True)
              print('BODY',(await pg.locator('body').inner_text())[:5000],flush=True)
              print('TABLES',await pg.locator('table').evaluate_all("es=>es.map(e=>({id:e.id,rows:e.rows.length,headers:[...e.querySelectorAll('th')].map(x=>x.textContent.trim())}))"),flush=True)
              print('CONTROLS',await pg.locator('a,button,input').evaluate_all("es=>es.filter(e=>e.getClientRects().length).slice(0,65).map(e=>e.outerHTML.slice(0,450))"),flush=True)
              print('PAPERCLIPS',await pg.locator('a.Attachmentclass').evaluate_all("es=>es.slice(0,20).map(e=>e.outerHTML)"),flush=True)
              for frame in pg.frames:
                print('FRAME',frame.url,flush=True)
                links=frame.locator('a.Attachmentclass:visible')
                for i in range(min(await links.count(),12)):
                  a=links.nth(i)
                  if 'present' not in (await a.get_attribute('title') or '').lower():continue
                  print('RECORD',await a.evaluate("e=>e.closest('tr')?.innerText"),flush=True)
                  await a.click(timeout=5000)
                  await pg.wait_for_timeout(1800)
                  files=frame.locator('a.downloadLink[data-size]:visible')
                  print('FILES',await files.all_text_contents(),flush=True)
                  for j in range(await files.count()):
                    f=files.nth(j)
                    if not (await f.inner_text()).lower().endswith('.pdf'):continue
                    try:
                      async with pg.expect_download(timeout=10000) as d:await f.click(timeout=5000)
                      dl=await d.value
                      path='output/'+re.sub(r'[^a-zA-Z0-9._-]','_',dl.suggested_filename)
                      await dl.save_as(path)
                      data=open(path,'rb').read()
                      assert data.startswith(b'%PDF-')
                      print('VERIFIED',path,len(data),len(PdfReader(path).pages),hashlib.sha256(data).hexdigest(),flush=True)
                      await b.close();return
                    except Exception as e:print('DOWNLOAD_ERROR',str(e)[:200],flush=True)
                  close=frame.locator('#AttachmentModal button[data-dismiss=modal]:visible').first
                  if await close.count():await close.click()
              await b.close()
              print('NO_PDF',flush=True)
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: randolph-pdf
          path: output/
          if-no-files-found: ignore
