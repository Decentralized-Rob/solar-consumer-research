name: Sterling guest session and attachment recovery
on:
  push:
    branches: [research/permitlink-sterling-20261127]
    paths: [.github/workflows/sterling-guest-recovery.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sterling-guest-recovery
  cancel-in-progress: true
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install playwright pypdf && python -m playwright install chromium
      - name: Target one known public roof permit
        run: |
          python -u - <<'PY'
          import asyncio, json, re, io, hashlib, traceback
          from pathlib import Path
          from playwright.async_api import async_playwright
          from pypdf import PdfReader
          BASE="https://www.permitlinkonline.com/csp/sterlinglive/"
          TARGET="26-252RB"
          OUT=Path("sterling-guest");OUT.mkdir(exist_ok=True)
          (OUT/"status.json").write_text(json.dumps({"target":TARGET,"result":"STARTED"}))
          saved=[]; tasks=[]; pages=[]
          async def save(data,source):
            if saved or not data.startswith(b"%PDF-"):return
            try:
              n=len(PdfReader(io.BytesIO(data)).pages)
              if not n:return
              m={"permit":TARGET,"pages":n,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"source":source}
              (OUT/"original.pdf").write_bytes(data)
              (OUT/"manifest.json").write_text(json.dumps(m,indent=2))
              saved.append(m);print("VERIFIED ORIGINAL",json.dumps(m),flush=True)
            except Exception as e:print("PDF parse error",repr(e))
          async def response(r):
            try:
              h=r.headers;typ=h.get("content-type","")
              if "pdf" in typ or "octet-stream" in typ or "ImageServer" in r.url:
                await save(await asyncio.wait_for(r.body(),8),r.url)
            except Exception as e:print("Response capture",str(e)[:120])
          async def download(d):
            try:
              p=OUT/"download.bin";await asyncio.wait_for(d.save_as(p),10);await save(p.read_bytes(),d.url);p.unlink(missing_ok=True)
            except Exception as e:print("Download capture",str(e)[:120])
          async def snap(p,label):
            try:
              x=await p.evaluate("""() => ({url:location.href,title:document.title,text:document.body.innerText.slice(0,1200),zen:!!window.zenPage,controls:[...document.querySelectorAll('input,button,a,img')].filter(e=>e.getClientRects().length).slice(0,90).map(e=>({tag:e.tagName,id:e.id,type:e.type,value:e.value,title:e.title,alt:e.alt,onclick:e.getAttribute('onclick'),text:(e.innerText||'').slice(0,70)})),tables:[...document.querySelectorAll('table')].map(t=>({id:t.id,rows:t.rows.length}))})""")
              (OUT/(label+".json")).write_text(json.dumps(x,indent=2));(OUT/(label+".html")).write_text(await p.content());print("SNAP",label,json.dumps(x)[:12000],flush=True);return x
            except Exception as e:print("Snap error",e);return {}
          async def goto(p,url):
            print("NAV",url,flush=True)
            r=await p.goto(url,wait_until="domcontentloaded",timeout=18000)
            print("HTTP",r.status if r else None,"URL",p.url,flush=True)
            await p.wait_for_timeout(1200)
          async def main():
            async with async_playwright() as pw:
              browser=await pw.chromium.launch(headless=True,args=["--disable-popup-blocking"])
              ctx=await browser.new_context(accept_downloads=True)
              ctx.set_default_timeout(4500)
              ctx.on("response",lambda r: tasks.append(asyncio.create_task(response(r))) if ("pdf" in r.headers.get("content-type","") or "octet-stream" in r.headers.get("content-type","") or "ImageServer" in r.url) else None)
              def watch(p):
                pages.append(p);p.on("download",lambda d:tasks.append(asyncio.create_task(download(d))))
              ctx.on("page",watch)
              p=await ctx.new_page()
              try:
                await goto(p,BASE+"DocumentLink.PublicLogin.cls")
                login=await snap(p,"login")
                for i in login.get("controls",[]):
                  desc=" ".join(str(i.get(k) or "") for k in ("title","alt","value","text","onclick","id"))
                  if re.search(r"guest|view information",desc,re.I) and i.get("id") and (i.get("tag") in ("BUTTON","IMG","A") or i.get("type") in ("button","submit","image")):
                    loc=p.locator("[id="+json.dumps(i["id"])+"]")
                    if await loc.count() and await loc.first.is_visible():
                      print("CLICK GUEST",i["id"],flush=True)
                      await loc.first.click(timeout=4500);await p.wait_for_timeout(1600);break
                for q in reversed(pages):
                  if "GuestPermitListCenter" in q.url:p=q;break
                if "GuestPermitListCenter" not in p.url:await goto(p,BASE+"DocumentLink.GuestPermitListCenter.cls")
                data=await snap(p,"index")
                if re.search(r"captcha|verify you are human",data.get("text",""),re.I):raise RuntimeError("Human verification required")
                row=p.get_by_text(TARGET,exact=True)
                if not await row.count():
                  print("Filtering public permit column",flush=True)
                  fields=await p.evaluate("""() => [...document.querySelectorAll('input[type=text]')].filter(e=>e.getClientRects().length).map(e=>({id:e.id,name:e.name,title:e.title,outer:e.outerHTML.slice(0,500)}))""")
                  print("FIELDS",json.dumps(fields),flush=True)
                  for f in fields:
                    if re.search(r"permit.*(id|number|num|filter|#)|filter.*permit",str(f),re.I) and f.get("id"):
                      field=p.locator("[id="+json.dumps(f["id"])+"]")
                      await field.fill(TARGET);await field.press("Enter");await p.wait_for_timeout(1500);break
                if not await row.count():
                  # Keep the manifest tied to the exact public permit.
                  raise RuntimeError("Target permit not rendered; see filter diagnostics")
                if not await row.count():raise RuntimeError("No matching rendered roofing row; see index snapshot")
                await row.first.click(timeout=4500)
                ctl=p.locator('input[value*="View Attachments" i],input[title*="View Attachments" i],img[title*="View Attachments" i],img[alt*="View Attachments" i],button:has-text("View Attachments")').filter(visible=True)
                if not await ctl.count():
                  for i in data.get("controls",[]):
                    if re.search(r"attachment",str(i),re.I) and i.get("id"):
                      ctl=p.locator("[id="+json.dumps(i["id"])+"]").filter(visible=True)
                      if await ctl.count():break
                if not await ctl.count():raise RuntimeError("No public attachment control found")
                await ctl.first.click(timeout=4500);await p.wait_for_timeout(1800)
                for q in reversed(pages):
                  if "Attachment" in q.url:p=q;break
                data=await snap(p,"attachments")
                js="""() => {let z=window.zenPage;if(!z)return [];let ids=['table',...Array.from(document.querySelectorAll('table[id]')).map(x=>x.id)];let out=[];for(let id of ids){try{let t=z.getComponentById(id);if(!t||typeof t.getRowData!=='function')continue;let n=Number(t.getProperty('rowCount'))||0;for(let i=0;i<Math.min(n,80);i++){try{let r=t.getRowData(i);if(r&&r.ImageId)out.push(r)}catch(e){}}}catch(e){}}return out}"""
                docs=await p.evaluate(js);print("PUBLIC ATTACHMENTS",[(d.get("FileName"),d.get("FileDescription"),d.get("FileType")) for d in docs],flush=True)
                docs.sort(key=lambda d:not bool(re.search(r"contract|proposal|estimate|agreement",str(d),re.I)))
                for d in docs[:12]:
                  meta=" ".join(str(d.get(k,"")) for k in ("FileName","FileDescription","FileType"))
                  if re.search(r"insurance|affidavit|workers.?comp|debris|plans?|drawing|license",meta,re.I):continue
                  if not re.search(r"pdf|contract|proposal|estimate|agreement|permit|application",meta,re.I):continue
                  u=BASE+"TaxLink.ImageServer.cls?ImageID="+str(d["ImageId"])+"&Decrypt=0"
                  try:r=await ctx.request.get(u,timeout=8000);await save(await r.body(),u)
                  except Exception as e:print("Direct original failed",str(e)[:150])
                  if saved:break
                if not saved:
                  rows=p.locator("td").filter(has_text=re.compile(r"contract|proposal|estimate|agreement",re.I))
                  if await rows.count():
                    await rows.first.click(timeout=4500)
                    op=p.locator('input[value*="Open Selected" i],input[title*="Open Selected" i],button:has-text("Open Selected"),input[onclick*="getDocument"]').filter(visible=True)
                    if await op.count():await op.first.click(timeout=4500);await p.wait_for_timeout(2000)
                if tasks:await asyncio.wait(tasks,timeout=12)
                if not saved:raise RuntimeError("No original PDF verified")
              except Exception as e:
                print("ERROR",repr(e),flush=True);(OUT/"error.txt").write_text(traceback.format_exc())
              finally:
                (OUT/"status.json").write_text(json.dumps({"target":TARGET,"result":"VERIFIED" if saved else "FAILED"}))
                await browser.close()
              if not saved:raise SystemExit(1)
          asyncio.run(asyncio.wait_for(main(),timeout=95))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sterling-guest-diagnostic
          path: sterling-guest/
          retention-days: 7
