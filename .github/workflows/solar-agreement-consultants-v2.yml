name: Public solar agreement consultant extraction
on:
  push:
    branches: [research/permitpro-sunrun-giga]
    paths: ['.github/workflows/solar-agreement-consultants-v2.yml']
permissions:
  actions: read
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45389709079 -R ${{ github.repository }} -n management-roof-evidence-bellingham -D prior
      - run: pip -q install requests pymupdf
      - run: |
          python -u - <<'PY'
          import requests,json,re,hashlib,datetime,concurrent.futures,shutil
          from pathlib import Path
          from urllib.parse import quote
          import fitz
          fitz.TOOLS.mupdf_display_errors(False)
          src=next(Path("prior").rglob("results.json"));j=json.loads(src.read_text());root=src.parent
          OUT=Path("verified_management_roof_packets");OUT.mkdir(exist_ok=True)
          def norm(s):return re.sub("[^A-Z0-9]","",s.upper())
          candidates=[]
          for r in j["results"]:
           if not r["target"] or norm(r["address"])=="46PICKERINGAV":continue
           sd=datetime.datetime.strptime(r["date"],"%m/%d/%y")
           for roof in r.get("roof_records",[]):
            exact=[x for x in r.get("address_records",[]) if x["cells"][3]==roof["application"] and norm(x["cells"][6])==norm(r["address"])]
            if not exact:continue
            rd=datetime.datetime.strptime(roof["date"],"%m/%d/%y")
            if abs((sd-rd).days)>365:continue
            candidates.append((sd,r,roof,exact[0]))
          candidates.sort(key=lambda x:x[0],reverse=True);candidates=candidates[:12]
          def get(u,data=None):
           rr=requests.post(u,data=data,timeout=35) if data else requests.get(u,timeout=35);rr.raise_for_status();return rr.content
          def work(row):
           sd,r,roof,exact=row;folder=OUT/r["application"];folder.mkdir(exist_ok=True)
           paired=[]
           for d in r["documents"]:
            if not d["target"]:continue
            p=root/Path(d["saved"]).relative_to("management_roof_evidence")
            dest=folder/("Sunrun_"+p.name);shutil.copyfile(p,dest);paired.append(d)
           aa=json.loads(get("https://permiteyes.us/bellingham/controller/publicattachments_controller.php",{"action":"displayAttach","ApplicationId":exact["uuid"]})).get("Attachments") or []
           docs=[]
           for a in aa:
            if not a["FileName"].lower().endswith(".pdf"):continue
            path="/mys3bucket/permiteyes.us/attachments/bellingham/building/"+a["AttachmentPath"]
            u="https://permiteyes.us/readfiles2.php?file="+quote(path)
            b=get(u)
            if not b.startswith(b"%PDF"):continue
            d=fitz.open(stream=b,filetype="pdf");p=folder/("Roof_"+roof["application"]+"_"+re.sub("[^A-Za-z0-9_.-]","_",a["FileName"]));p.write_bytes(b)
            docs.append({"filename":a["FileName"],"source":u,"path":path,"saved":str(p),"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest(),"pages":len(d),"text":"\n".join(pg.get_text() for pg in d)})
           out={"solar_application":r["application"],"solar_date":r["date"],"address":r["address"],"solar_documents":paired,"roof_record":roof,"exact_address_record":exact,"roof_documents":docs}
           (folder/"provenance.json").write_text(json.dumps(out,indent=2));print("PAIRED_PACKET",len(docs),flush=True)
           return out
          out=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as p:
           for f in p.map(work,candidates):out.append(f)
          (OUT/"results.json").write_text(json.dumps(out,indent=2));print("COMPLETE",len(out),flush=True)
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-management-roof-packets
          path: verified_management_roof_packets/
          retention-days: 1
