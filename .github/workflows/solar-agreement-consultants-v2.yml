name: Public solar agreement consultant extraction
on:
  push:
    branches: [research/permitpro-sunrun-giga]
    paths: ['.github/workflows/solar-agreement-consultants-v2.yml']
permissions:
  actions: read
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45391613492 -R ${{ github.repository }} -n verified-management-roof-packets -D prior
      - run: pip -q install requests pymupdf
      - run: |
          python -u - <<'PY'
          import requests,json,re,hashlib,html
          from pathlib import Path
          from urllib.parse import quote,urljoin
          import fitz
          BASE="https://permiteyes.us/bellingham/"
          OUT=Path("public_attachment_recheck");OUT.mkdir(exist_ok=True)
          S=requests.Session()
          page=S.get(BASE+"publicview.php",timeout=25);page.raise_for_status()
          for src in re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',page.text,re.I):
           u=urljoin(page.url,src)
           if not u.startswith(BASE):continue
           try:
            t=S.get(u,timeout=15).text
            for line in t.splitlines():
             if re.search(r'publicattachments|displayAttach|public.*(?:document|inspection|permit)',line,re.I):print("PUBLIC_UI",line[:250])
           except Exception:pass
          prior=json.loads(next(Path("prior").rglob("results.json")).read_text())
          ids={"77457","77461","79156","79947","85057","76375","79712","80685"}
          result=[]
          for r in prior:
           if r["roof_record"]["application"] not in ids:continue
           address=r["address"]; print("ADDRESS",address)
           p={"draw":"1","start":"0","length":"200","search[value]":address,"search[regex]":"false","order[0][column]":"3","order[0][dir]":"desc"}
           for i in range(13):
            for k,v in [("data",str(i)),("name",""),("searchable","true"),("orderable","true"),("search[value]",""),("search[regex]","false")]:p[f"columns[{i}][{k}]"]=v
           j=S.post(BASE+"ajax/getbuildingpublichome.php",data=p,timeout=35).json()
           def norm(x):return re.sub("[^a-z0-9]","",x.lower())
           for rr in j.get("data",[]):
            c=[html.unescape(re.sub("<[^>]+>","",str(x))).strip() for x in rr]
            if len(c)<12 or norm(c[6])!=norm(address):continue
            m=re.search(r'data-application-id=["\x27]([^"\x27]+)',rr[0])
            if not m:continue
            aid=c[3];uuid=m.group(1)
            ar=S.post(BASE+"controller/publicattachments_controller.php",data={"action":"displayAttach","ApplicationId":uuid},timeout=30);ar.raise_for_status()
            raw=ar.json();aa=raw.get("Attachments") or []
            print("RECORD",aid,c[10],c[7],"attachment_count",len(aa),"response_keys",list(raw))
            entry={"address":address,"application":aid,"permit":c[10],"scope":c[8],"raw":raw,"docs":[]}
            for a in aa:
             name=a.get("FileName","");path=a.get("AttachmentPath","")
             if not path:continue
             if not path.startswith("/mys3bucket/") and a.get("ID_import") in [None,"","0",0]:path="/mys3bucket/permiteyes.us/attachments/bellingham/building/"+path
             u="https://permiteyes.us/readfiles2.php?file="+quote(path)
             try:
              b=S.get(u,timeout=30); data=b.content
              pdf=data.startswith(b"%PDF"); info={"name":name,"status":b.status_code,"bytes":len(data),"pdf":pdf}
              if pdf:
               d=fitz.open(stream=data,filetype="pdf");t="\n".join(pg.get_text() for pg in d)
               hits=bool(re.search(r"roofing agreement|roofing renovation contract|sunrun subsidy|roofing contract|total roofing price",t,re.I))
               info.update({"pages":len(d),"contract_keywords":hits,"sha256":hashlib.sha256(data).hexdigest()})
               if hits and r["roof_record"]["application"] not in {"79712","80685"}:
                (OUT/(aid+"_"+re.sub("[^A-Za-z0-9_.-]","_",name)+("" if name.lower().endswith(".pdf") else ".pdf"))).write_bytes(data)
              print("ATTACHMENT",aid,name,info)
              entry["docs"].append(info)
             except Exception as e:print("ERROR",aid,name,str(e)[:180])
            result.append(entry)
          (OUT/"audit.json").write_text(json.dumps(result,indent=2))
          print("FINISHED",len(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-attachment-recheck
          path: public_attachment_recheck/
          retention-days: 1
