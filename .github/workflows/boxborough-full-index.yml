name: Mill Lane solar building original attachments
on:
  push:
    branches:
      - research/boxborough-full-index-20261121
    paths:
      - "tools/mill_lane_download_original_public_uploads.py"
      - ".github/workflows/boxborough-full-index.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Search public permit index
        run: python -u tools/mill_lane_download_original_public_uploads.py
      - name: Preserve independent search results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brimfield-mill-lane-solar-originals
          path: mill_lane_solar_original_attachments/
          retention-days: 2
          if-no-files-found: warn
