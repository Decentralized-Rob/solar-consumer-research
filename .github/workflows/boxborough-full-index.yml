name: Brimfield Mill Lane paired roofing and solar source exports
on:
  push:
    branches:
      - research/boxborough-full-index-20261121
    paths:
      - "tools/brimfield_mill_lane_evidence_packet.py"
      - ".github/workflows/boxborough-full-index.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Search public permit index
        run: python -u tools/brimfield_mill_lane_evidence_packet.py
      - name: Preserve independent search results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brimfield-mill-lane-evidence
          path: brimfield_15_mill_lane/
          retention-days: 2
          if-no-files-found: warn
