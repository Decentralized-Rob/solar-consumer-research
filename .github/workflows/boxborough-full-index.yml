name: Boylston Giga and Sunrun full index
on:
  push:
    branches:
      - research/boxborough-full-index-20261121
    paths:
      - "tools/boylston_giga_sunrun_index.py"
      - ".github/workflows/boxborough-full-index.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Search public permit index
        run: python -u tools/boylston_giga_sunrun_index.py
      - name: Preserve independent search results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boylston-giga-sunrun-index-results
          path: boylston_giga_search/
          retention-days: 2
          if-no-files-found: warn
