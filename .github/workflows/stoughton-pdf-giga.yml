name: Stoughton original PDF then Giga search
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/stoughton-pdf-giga.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: |
          pip -q install playwright pypdf
          python -m playwright install chromium
      - run: |
          mkdir -p output
          python - <<'PY'
          import asyncio,os,re,hashlib,json
          from playwright.async_api import async_playwright
          from pypdf import PdfReader
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              c=await b.new_context(accept_downloads=True)
              pg=await c.new_page()
              await pg.goto('https://permiteyes.us/stoughton/publicview.php',wait_until='domcontentloaded',timeout=35000)
              await pg.wait_for_timeout(4000)
              async def save_first(row):
                await row.locator('a.Attachmentclass[title="Attachment(s) present"]').first.click(timeout=5000)
                m=pg.locator('#AttachmentModal')
                await pg.wait_for_timeout(1200)
                links=m.locator('a.downloadLink[data-size]:visible,a[data-href][data-download]:visible')
                print('ATTACHMENTS',await links.all_text_contents(),flush=True)
                for j in range(min(await links.count(),12)):
                  l=links.nth(j)
                  name=(await l.inner_text()).strip()
                  if not name.lower().endswith('.pdf'):continue
                  try:
                    async with pg.expect_download(timeout=7000) as dl:await l.click(timeout=4000)
                    d=await dl.value
                    f='output/'+re.sub(r'[^a-zA-Z0-9._-]','_',d.suggested_filename)
                    await d.save_as(f)
                    data=open(f,'rb').read()
                    assert data.startswith(b'%PDF-')
                    n=len(PdfReader(f).pages)
                    print('VERIFIED',f,len(data),n,hashlib.sha256(data).hexdigest(),flush=True)
                    return True
                  except Exception as e:print('DOWNLOAD_ERROR',str(e)[:160],flush=True)
                close=m.locator('[data-dismiss=modal]:visible').first
                if await close.count():await close.click()
                return False
              verified=False
              for page in range(3):
                rows=pg.locator('tr:has(a.Attachmentclass[title="Attachment(s) present"]):visible')
                print('ATTACHED_ROWS',await rows.count(),flush=True)
                for i in range(min(await rows.count(),15)):
                  row=rows.nth(i)
                  record=await row.inner_text()
                  if not re.search(r'building|roof|residential|construction|solar|alteration|RESI',record,re.I):continue
                  print('TEST_RECORD',record.replace(chr(10),' '),flush=True)
                  if await save_first(row):
                    verified=True
                    break
                if verified:break
                nxt=pg.locator('.paginate_button.next:visible:not(.disabled)').first
                if not await nxt.count():break
                await nxt.click();await pg.wait_for_timeout(800)
              if not verified:
                print('PREFLIGHT_FAILED_SKIP_GIGA',flush=True)
                await b.close()
                return
              await pg.reload(wait_until='domcontentloaded');await pg.wait_for_timeout(2500)
              inp=pg.locator('input[name=applicant_name]:visible').first
              found={}
              for q in ['giga','espigar']:
                await inp.fill(q);await inp.dispatch_event('keyup');await inp.press('Enter');await pg.wait_for_timeout(1800)
                records={}
                for k in range(25):
                  rr=await pg.locator('tr:has(a.view_app):visible').evaluate_all("es=>es.map(e=>({cells:[...e.querySelectorAll('td')].map(x=>x.textContent.trim()),id:e.querySelector('a.view_app').dataset.id,attachment:e.querySelector('a.Attachmentclass')?.title||''}))")
                  for r in rr:records[r['id']]=r
                  nxt=pg.locator('.paginate_button.next:visible:not(.disabled)').first
                  if not await nxt.count():break
                  await nxt.click();await pg.wait_for_timeout(800)
                found[q]=list(records.values())
                print('RESULT',q,json.dumps(found[q]),flush=True)
              open('output/giga_search.json','w').write(json.dumps(found,indent=2))
              await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stoughton-original-pdf-and-giga-results
          path: output/
          if-no-files-found: ignore
