name: Sterling Sunrun roof permit crossmatch
on:
  push:
    branches: [research/permitlink-sterling-20261127]
    paths: [.github/workflows/sterling-sunrun-roof.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sterling-sunrun-roof
  cancel-in-progress: true
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip -q install playwright pypdf && python -m playwright install chromium
      - name: Build bounded solar-first index
        run: |
          mkdir -p sterling-index sterling-roof
          cat > /tmp/sterling.py <<'PY'
          import asyncio, re, json, io, hashlib, datetime, sys, time
          from pathlib import Path
          from playwright.async_api import async_playwright
          from pypdf import PdfReader
          B="https://www.permitlinkonline.com/csp/sterlinglive/"
          IDX=B+"DocumentLink.GuestPermitListCenter.cls"
          I=Path("sterling-index"); O=Path("sterling-roof")
          ROOF=re.compile(r"roof|shingle|reroof",re.I)
          SOLAR=re.compile(r"solar|photovoltaic|\bpv\b",re.I)
          SUN=re.compile(r"sun\s*run",re.I)
          JS="""() => {let t=zenPage.getComponent(76);let n=Number(t.getProperty('rowCount'))||0;let rows=[];for(let i=0;i<Math.min(n||100,100);i++){try{let r=t.getRowData(i);if(r&&r.PermitID&&r.DocumentId)rows.push(r)}catch(e){}}return {n,rows}}"""
          ATT="""() => {let z=window.zenPage;if(!z)return [];let out=[];let seen=new Set();for(let i=1;i<180;i++){try{let t=z.getComponent(i);if(!t||typeof t.getRowData!=='function')continue;let n=Number(t.getProperty('rowCount'))||0;for(let j=0;j<Math.min(n,80);j++){try{let r=t.getRowData(j);if(r&&r.ImageId&&!seen.has(r.ImageId)){out.push(r);seen.add(r.ImageId)}}catch(e){}}}catch(e){}}return out}"""
          def dump(p,x):p.write_text(json.dumps(x,indent=2))
          def addr(r):return (str(r.get("HouseNumber","")).strip().upper(),re.sub(r"\W","",str(r.get("Location",""))).upper())
          def date(r):
            for k in ("Issued","Applied"):
              try:return datetime.datetime.strptime(r.get(k,""),"%m/%d/%Y")
              except:pass
          def recent(r):return bool(date(r) and date(r).year>=2022)
          def clean(r):return {k:r.get(k) for k in ("HouseNumber","Location","PermitID","PermitType","Applied","Issued","WorkDescription","DocumentId","Maid")}
          async def login(p):
            await p.goto(B+"DocumentLink.PublicLogin.cls",wait_until="domcontentloaded",timeout=18000)
            await p.locator("#control_95").click(timeout=6000)
            await p.wait_for_url("**/DocumentLink.GuestPermitListCenter.cls*",timeout=12000)
            await p.wait_for_timeout(600)
          async def pages(p,limit):
            seen=set(); out=[]
            for i in range(limit):
              v=await p.evaluate(JS); rows=v["rows"]
              sig=tuple(str(r["DocumentId"]) for r in rows)
              if not sig or sig in seen:break
              seen.add(sig);out.extend(rows)
              nxt=p.locator('a[title="Go to next page"]').filter(visible=True)
              if not await nxt.count():break
              try:await nxt.first.click(timeout=2500)
              except:break
              await p.wait_for_timeout(500)
            return out
          async def search(p,term):
            # Exact sequence validated by the successful standalone test.
            await p.locator("#control_41").fill(term)
            await p.locator("#control_43").click(timeout=5000)
            await p.wait_for_timeout(1000)
            return await p.evaluate("""() => {let t=zenPage.getComponent(76);let n=Number(t.getProperty('rowCount'))||0;let rows=[];for(let i=0;i<Math.min(n,1500);i++){try{let r=t.getRowData(i);if(r&&r.PermitID&&r.DocumentId)rows.push(r)}catch(e){}}return {n,rows}}""")
          async def index(p):
            records={}; roofs={}; status=[]
            for term in ("solar","roof"):
              q=await p.context.new_page()
              try:
                await login(q)
                v=await asyncio.wait_for(search(q,term),20)
                rows=v["rows"]
                for r in rows:
                  if not recent(r) or not addr(r)[0] or r.get("PermitID")=="Draft":continue
                  desc=str(r.get("WorkDescription",""))
                  if SOLAR.search(desc) and re.search(r"panel|photovoltaic|array|\\bpv\\b|solar system",desc,re.I) and not re.search(r"ground.mount|attic.*fan|water heater|no solar",desc,re.I):
                    records[str(r["DocumentId"])]=clean(r)
                  if ROOF.search(desc) and not re.search(r"solar panels|photovoltaic|solar array|\\bpv\\b",desc,re.I):
                    roofs[str(r["DocumentId"])]=clean(r)
                status.append({"term":term,"reported":v["n"],"read":len(rows),"solar_candidates":len(records),"roof_candidates":len(roofs)})
              except Exception as e:status.append({"term":term,"error":repr(e)[:300]})
              finally:await q.close()
              print("INDEX",json.dumps(status[-1]),flush=True)
              ordered=sorted(records.values(),key=lambda r:(not bool(SUN.search(str(r))),-(date(r).toordinal())))
              dump(I/"solar-index.json",ordered);dump(I/"roof-index.json",list(roofs.values()));dump(I/"search-status.json",status)
            pairs=[s for s in ordered if any(addr(r)==addr(s) and abs((date(r)-date(s)).days)<=365 for r in roofs.values())]
            dump(I/"solar-index.json",pairs)
            print("INDEX COMPLETE",len(records),"solar",len(roofs),"roof",len(pairs),"paired solar permits",flush=True)
            if not records or not roofs:raise RuntimeError("Index incomplete; no valid solar or roof records")
          async def address_records(p,s):
            # Match against the recovered public roof index, without another portal search.
            rows=json.loads((I/"roof-index.json").read_text())
            return [r for r in rows if addr(r)==addr(s) and recent(r)]
          async def getdocs(a,r):
            u=B+"DocumentLink.GuestAttachmentCenter.cls?DocumentId="+str(r["DocumentId"])+"&QueryId="+str(r["DocumentId"])+"&Maid="+str(r["Maid"])
            await a.goto(u,wait_until="domcontentloaded",timeout=10000)
            await a.wait_for_function("!!window.zenPage",timeout=5000)
            await a.wait_for_timeout(900)
            return await a.evaluate(ATT)
          def eligible(d):
            x=" ".join(str(d.get(k,"")) for k in ("FileName","FileDescription","FileType"))
            return bool(re.search(r"contract|proposal|estimate|agreement|ppa|change.order|\bcap\b|permit|application",x,re.I)) and not re.search(r"insurance|affidavit|workers.?comp|debris|plans?|drawing|license|\bcoi\b|\bcsl\b|\bhic\b",x,re.I)
          async def fetch(ctx,r,d):
            u=B+"TaxLink.ImageServer.cls?ImageID="+str(d["ImageId"])+"&Decrypt=0"
            resp=await ctx.request.get(u,timeout=8000);body=await resp.body()
            if not body.startswith(b"%PDF-"):return None
            reader=PdfReader(io.BytesIO(body))
            text=""
            for pg in reader.pages[:25]:
              try:text+=" "+(pg.extract_text() or "")
              except:pass
            name=str(d.get("FileName") or d.get("FileDescription") or "original.pdf")
            m={"permit":r["PermitID"],"name":name,"pages":len(reader.pages),"bytes":len(body),"sha256":hashlib.sha256(body).hexdigest(),"source":u,"sunrun_text":bool(SUN.search(text)),"giga_text":bool(re.search(r"giga property|espigar",text,re.I)),"text_chars":len(text)}
            return body,m
          async def recover(p,ctx,a,s):
            rows=await address_records(p,s)
            roofs=[r for r in rows if r["DocumentId"]!=s["DocumentId"] and ROOF.search(str(r.get("WorkDescription",""))) and not SOLAR.search(str(r.get("WorkDescription",""))) and abs((date(r)-date(s)).days)<=365]
            print("ADDRESS CHECK",s["PermitID"],"roof candidates",len(roofs),flush=True)
            if not roofs:return None
            sd=await getdocs(a,s)
            hit=bool(SUN.search(str(s))) or any(SUN.search(str(d)) for d in sd)
            sol=[]
            for d in sorted(sd,key=lambda d:not bool(re.search(r"sunrun|agreement|contract|ppa",str(d),re.I))):
              if not eligible(d):continue
              try:
                f=await fetch(ctx,s,d)
                if f:sol.append(f);hit=hit or f[1]["sunrun_text"]
              except Exception as e:print("SOLAR PDF ERROR",str(e)[:120])
            if not hit:return None
            for r in sorted(roofs,key=lambda r:abs((date(r)-date(s)).days)):
              rd=await getdocs(a,r);roof=[]
              for d in rd:
                if not eligible(d):continue
                try:
                  f=await fetch(ctx,r,d)
                  if f:roof.append(f)
                except Exception as e:print("ROOF PDF ERROR",str(e)[:120])
              contracts=[f[1]["name"] for f in roof if re.search(r"contract|proposal|estimate|agreement",f[1]["name"],re.I)]
              if not contracts:continue
              result={"address":str(s["HouseNumber"])+" "+str(s["Location"]),"solar_permit":s["PermitID"],"roof_permit":r["PermitID"],"solar_date":str(date(s).date()),"roof_date":str(date(r).date()),"roof_contracts":contracts,"files":[]}
              folder=O/re.sub(r"[^A-Za-z0-9_-]","_",s["PermitID"]);folder.mkdir(exist_ok=True)
              for body,m in sol+roof:
                fn=re.sub(r"[^A-Za-z0-9_.-]","_",m["permit"]+"_"+m["name"])
                if not fn.lower().endswith(".pdf"):fn+=".pdf"
                (folder/fn).write_bytes(body);m["file"]=fn;result["files"].append(m)
              dump(folder/"manifest.json",result)
              print("VERIFIED SUNRUN ROOF",json.dumps(result),flush=True)
              return result
            return None
          async def batch(p,ctx,number):
            statefile=O/"state.json"
            state=json.loads(statefile.read_text()) if statefile.exists() else {"cursor":0,"matches":[],"errors":[]}
            candidates=json.loads((I/"solar-index.json").read_text()) if (I/"solar-index.json").exists() else []
            a=await ctx.new_page();start=time.monotonic();attempts=0
            while state["cursor"]<len(candidates) and len(state["matches"])<3 and attempts<12 and time.monotonic()-start<65:
              s=candidates[state["cursor"]];state["cursor"]+=1;attempts+=1
              if any(x["address"]==str(s["HouseNumber"])+" "+str(s["Location"]) for x in state["matches"]):continue
              result=None
              try:
                result=await asyncio.wait_for(recover(p,ctx,a,s),35)
                if result:state["matches"].append(result)
              except Exception as e:state["errors"].append({"permit":s["PermitID"],"error":str(e)[:250]})
              dump(statefile,state)
              if result:break
            dump(statefile,state);print("BATCH",number,"checked",state["cursor"],"of",len(candidates),"matches",len(state["matches"]),flush=True)
          async def main():
            async with async_playwright() as pw:
              b=await pw.chromium.launch(headless=True);ctx=await b.new_context();p=await ctx.new_page();p.set_default_timeout(5000)
              try:
                await login(p)
                if sys.argv[1]=="index":await index(p)
                else:await batch(p,ctx,sys.argv[1])
              finally:await b.close()
          asyncio.run(main())
          PY
          python -u /tmp/sterling.py index
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sterling-solar-index
          path: sterling-index/
          retention-days: 14
      - name: First property or bounded search
        if: success()
        run: python -u /tmp/sterling.py 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sterling-roof-batch-1
          path: sterling-roof/
          retention-days: 14
      - name: Second property or bounded search
        if: success()
        run: python -u /tmp/sterling.py 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sterling-roof-batch-2
          path: sterling-roof/
          retention-days: 14
      - name: Third property or bounded search
        if: success()
        run: python -u /tmp/sterling.py 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sterling-roof-batch-3
          path: sterling-roof/
          retention-days: 14
