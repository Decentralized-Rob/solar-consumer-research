name: PermitLink West Boylston Giga Sunrun index
on:
  push:
    branches: [research/permitlink-westboylston-20261123]
    paths:
      - "tools/permitlink_westboylston_search.py"
      - ".github/workflows/permitlink-westboylston-search.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect public index
        run: python -u tools/permitlink_westboylston_search.py
      - name: Preserve portal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: westboylston-giga-sunrun-index
          path: permitlink_westboylston_index/
          if-no-files-found: warn
          retention-days: 7
