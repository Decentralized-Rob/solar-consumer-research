name: One MA roof plus Sunrun original PDFs
on:
  push:
    branches: [research/barnstable-laserfiche-20261122]
    paths: ["tools/one_case_permiteyes_pdf.py", ".github/workflows/one-case-permiteyes.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Find and download first complete original permit pair
        run: python -u tools/one_case_permiteyes_pdf.py
      - name: Publish original PDFs and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-ma-roof-and-sunrun-pdfs
          path: one_case_original_permit_pdfs/
          retention-days: 7
          if-no-files-found: error
