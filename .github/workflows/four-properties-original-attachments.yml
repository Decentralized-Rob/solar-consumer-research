name: Four matched properties original permit attachments
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/four-properties-original-attachments.yml']
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        town: [milton, stoughton]
    steps:
      - run: |
          pip -q install playwright pypdf
          python -m playwright install chromium
      - env:
          TOWN: ${{ matrix.town }}
        run: |
          mkdir -p output
          python - <<'PY'
          import asyncio,os,re,json,hashlib
          from playwright.async_api import async_playwright
          from pypdf import PdfReader
          town=os.environ['TOWN']
          targets={
            'milton': [('52 Hollingsworth Rd',['64243','63650','63590']),('15 Magnolia Rd',['63806','63109','63108'])],
            'stoughton':[('24 Warren Ave',['23176','23391']),('47 Water St',['23968','23365'])]
          }[town]
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              c=await b.new_context(accept_downloads=True)
              pg=await c.new_page()
              pg.set_default_timeout(6000)
              manifest=[]
              for address,ids in targets:
                for ident in ids:
                  await pg.goto('https://permiteyes.us/'+town+'/publicview.php',wait_until='domcontentloaded')
                  await pg.wait_for_timeout(1800)
                  inp=pg.locator('input[name=app_id]:visible').last
                  await inp.fill(ident);await inp.dispatch_event('keyup');await inp.press('Enter')
                  await pg.wait_for_timeout(1500)
                  a=pg.locator('a.view_app[data-id="'+ident+'"]:visible')
                  if not await a.count():
                    await inp.fill('');await inp.dispatch_event('keyup');await inp.press('Enter')
                    await pg.wait_for_timeout(500)
                    site=pg.locator('input[name=site_address]:visible,input[name=site_add]:visible').last
                    if await site.count():
                      await site.fill(address);await site.dispatch_event('keyup');await site.press('Enter')
                    else:
                      num,street=address.split(' ',1)
                      for name,value in [('street_no',num),('street_name',street)]:
                        x=pg.locator('input[name='+name+']:visible').last
                        await x.fill(value);await x.dispatch_event('keyup');await x.press('Enter')
                    await pg.wait_for_timeout(1400)
                  if not await a.count():
                    print('RECORD_NOT_FOUND',address,ident,flush=True);continue
                  row=a.first.locator('xpath=ancestor::tr[1]')
                  print('RECORD',address,ident,(await row.inner_text()).replace(chr(10),' '),flush=True)
                  control=row.locator('a.Attachmentclass').first
                  rec={'address':address,'id':ident,'files':[]}
                  manifest.append(rec)
                  if not await control.count():
                    print('NO_ATTACHMENT_CONTROL',ident,flush=True);continue
                  print('CONTROL',ident,await control.evaluate('e=>e.outerHTML'),flush=True)
                  await control.click()
                  m=pg.locator('#AttachmentModal')
                  await pg.wait_for_timeout(1500)
                  links=m.locator('a[data-href][data-download]:visible,a.downloadLink[data-size]:visible')
                  names=await links.evaluate_all("es=>es.map(e=>({name:e.textContent.trim(),file:e.dataset.download||'',size:e.dataset.size||''}))")
                  print('ATTACHMENTS',ident,json.dumps(names),flush=True)
                  seen=set()
                  for j,meta in enumerate(names):
                    name=meta['name'] or meta['file']
                    if not re.search(r'\.(pdf|jpe?g|png)$',name,re.I) or name in seen:continue
                    if not meta['name']:continue
                    seen.add(name)
                    l=links.nth(j)
                    try:
                      async with pg.expect_download(timeout=7500) as dl:await l.click(timeout=3500)
                      d=await dl.value
                      folder='output/'+re.sub(r'[^a-zA-Z0-9._-]','_',address)+'/'+ident
                      os.makedirs(folder,exist_ok=True)
                      f=folder+'/'+re.sub(r'[^a-zA-Z0-9._-]','_',d.suggested_filename)
                      await d.save_as(f);data=open(f,'rb').read()
                      assert data.startswith((b'%PDF-',b'\xff\xd8\xff',b'\x89PNG'))
                      pages=len(PdfReader(f).pages) if data.startswith(b'%PDF-') else 'image'
                      info={'file':f,'bytes':len(data),'pages':pages,'sha256':hashlib.sha256(data).hexdigest()}
                      rec['files'].append(info)
                      print('VERIFIED',json.dumps(info),flush=True)
                    except Exception as e:print('DOWNLOAD_ERROR',ident,name,str(e)[:160],flush=True)
                  if not names:print('EMPTY_MODAL',ident,(await m.inner_text())[:300],flush=True)
              open('output/manifest.json','w').write(json.dumps(manifest,indent=2))
              print('SUMMARY',json.dumps([{**{k:v for k,v in x.items() if k!='files'},'count':len(x['files'])} for x in manifest]),flush=True)
              await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-attachments-${{ matrix.town }}
          path: output/
