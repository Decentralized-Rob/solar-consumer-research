name: Massachusetts court RECAP original-document recovery

on:
  workflow_dispatch:
    inputs:
      case_number:
        description: 'Verified federal docket number for a qualifying Giga case or Sunrun case with matching roof permit'
        type: string
        required: true
      court:
        description: 'Massachusetts US District Court only (mad)'
        type: choice
        options: [mad]
        default: mad
      company:
        description: 'Company under investigation'
        type: choice
        options: [sunrun, giga]
        default: sunrun
      address:
        description: 'Case property address (required for Sunrun, must match roof permit)'
        type: string
        required: false
      roof_permit_url:
        description: 'Official matching roof permit URL (required for Sunrun)'
        type: string
        required: false
      roof_permit_number:
        description: 'Matching roof permit number (required for Sunrun)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify collector, permit gate, and PDF integrity without network
        run: python -m unittest discover -s tools/court-records/tests -v

  live-giga-discovery:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search only Massachusetts federal RECAP dockets for Giga Property Solutions
        run: python tools/court-records/discover_recap.py --court mad --out court-recap-output
      - name: Archive exact discovery outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giga-recap-discovery
          path: court-recap-output/DISCOVERY.json
          retention-days: 3
          if-no-files-found: warn

  recover:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
      CASE_NUMBER: ${{ inputs.case_number }}
      COURT: ${{ inputs.court }}
      COMPANY: ${{ inputs.company }}
      CASE_ADDRESS: ${{ inputs.address }}
      ROOF_PERMIT_URL: ${{ inputs.roof_permit_url }}
      ROOF_PERMIT_NUMBER: ${{ inputs.roof_permit_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover docket, enumerate original court filings, retrieve public PDFs
        shell: bash
        run: |
          python tools/court-records/recap_retrieve.py \
            --case-number "$CASE_NUMBER" \
            --court "$COURT" \
            --company "$COMPANY" \
            --address "$CASE_ADDRESS" \
            --roof-permit-url "$ROOF_PERMIT_URL" \
            --roof-permit-number "$ROOF_PERMIT_NUMBER" \
            --download \
            --out court-recap-output
      - name: Archive manifest and original PDF bytes (no site publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-recap-evidence
          path: court-recap-output/
          retention-days: 3
          if-no-files-found: warn
