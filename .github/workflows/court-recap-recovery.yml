name: Court RECAP original-document recovery

on:
  workflow_dispatch:
    inputs:
      case_number:
        description: 'Verified federal docket number for a qualifying Giga case or Sunrun case with matching roof permit'
        type: string
        required: true
      court:
        description: 'CourtListener court ID (e.g. mad)'
        type: string
        required: true
      company:
        description: 'Company under investigation'
        type: choice
        options: [sunrun, giga]
        default: sunrun
      address:
        description: 'Candidate property address (not verified from permit)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
      CASE_NUMBER: ${{ inputs.case_number }}
      COURT: ${{ inputs.court }}
      COMPANY: ${{ inputs.company }}
      CASE_ADDRESS: ${{ inputs.address }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover docket, enumerate original court filings, retrieve public PDFs
        shell: bash
        run: |
          python tools/court-records/recap_retrieve.py \
            --case-number "$CASE_NUMBER" \
            --court "$COURT" \
            --company "$COMPANY" \
            --address "$CASE_ADDRESS" \
            --download \
            --out court-recap-output
      - name: Archive manifest and original PDF bytes (no site publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: court-recap-evidence
          path: court-recap-output/
          retention-days: 3
          if-no-files-found: warn
