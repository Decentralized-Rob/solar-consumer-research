name: Worcester original contract retrieval
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/municipal-contract-retrieval.yml']
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          pip -q install playwright pypdf
          python -m playwright install chromium
      - run: |
          python - <<'PY'
          import asyncio,json,re,os
          from pathlib import Path
          from playwright.async_api import async_playwright
          OUT=Path('output');OUT.mkdir(exist_ok=True)
          async def main():
           async with async_playwright() as p:
            b=await p.chromium.launch()
            c=await b.new_context(accept_downloads=True)
            pg=await c.new_page()
            events=[];pending=[]
            async def capture(r):
             item={'url':r.url,'status':r.status,'type':r.request.resource_type,'content_type':r.headers.get('content-type','')}
             events.append(item)
             if r.request.resource_type in ['xhr','fetch'] or 'application/pdf' in item['content_type']:
              try:
               data=await r.body()
               name='response_'+str(len(events))
               if data.startswith(b'%PDF-'): ext='.pdf'
               elif 'json' in item['content_type']: ext='.json'
               else: ext='.txt'
               if len(data)<15000000:
                f=OUT/(name+ext);f.write_bytes(data);item['file']=f.name
              except Exception as e:item['error']=str(e)[:200]
            pg.on('response',lambda r:pending.append(asyncio.create_task(capture(r))))
            for label,u in [
              ('roof','https://www.worcesterma.gov/inspections/permit-history/permit-details/B-25-5033'),
              ('solar','https://www.worcesterma.gov/inspections/permit-history/permit-details/B-25-4594'),
              ('portal','https://worcesterma.portal.opengov.com/search')]:
             try:
              await pg.goto(u,wait_until='domcontentloaded',timeout=45000)
              await pg.wait_for_timeout(6000)
              text=await pg.locator('body').inner_text()
              (OUT/(label+'.txt')).write_text(text)
              (OUT/(label+'.html')).write_text(await pg.content())
              await pg.screenshot(path=str(OUT/(label+'.png')),full_page=True)
              links=await pg.locator('a,button,input,iframe,embed,object').evaluate_all("es=>es.map(e=>({tag:e.tagName,text:e.innerText?.trim(),href:e.getAttribute('href'),src:e.getAttribute('src'),data:e.getAttribute('data'),type:e.getAttribute('type'),name:e.getAttribute('name')}))")
              (OUT/(label+'_controls.json')).write_text(json.dumps(links,indent=2))
              print('PAGE',label,pg.url,'TEXT',text[:450].replace('\n',' '),'CONTROLS',len(links),flush=True)
              if label=='portal' and 'portal does not exist' not in text.lower():
               print('PORTAL_READY',flush=True)
             except Exception as e: print('PAGE_ERROR',label,str(e)[:300],flush=True)
            if pending:await asyncio.gather(*pending,return_exceptions=True)
            (OUT/'network.json').write_text(json.dumps(events,indent=2))
            print('NETWORK',json.dumps([e for e in events if e['type'] in ['xhr','fetch']]),flush=True)
            await b.close()
          asyncio.run(main())
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worcester-marion-retrieval
          path: output/
          retention-days: 7
