name: Municipal original contract retrieval
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/municipal-contract-retrieval.yml']
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          pip -q install playwright pypdf
          python -m playwright install chromium
      - run: |
          mkdir -p output
          python - <<'PY'
          import asyncio,os,re,hashlib,json
          from playwright.async_api import async_playwright
          from pypdf import PdfReader
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              c=await b.new_context(accept_downloads=True)
              pg=await c.new_page()
              pg.set_default_timeout(6500)
              for town,address,ids in [('milton','15 magnolia rd',['63806','63108']),('milton','52 hollingsworth rd',['64243','63650']),('stoughton','47 water st',['23968','23365']),('stoughton','24 warren ave',['23176','23391'])]:
                await pg.goto('https://permiteyes.us/'+town+'/publicview.php',wait_until='domcontentloaded')
                await pg.wait_for_timeout(3000)
                async def search(sel,value):
                  inp=pg.locator(sel).first
                  await inp.fill(value)
                  await inp.dispatch_event('keyup')
                  await inp.press('Enter')
                  await pg.wait_for_timeout(1250)
                if town=='milton':
                  await search('input[name=site_address]:visible',address)
                else:
                  num,street=address.split(' ',1)
                  await search('input[name=street_no]:visible',num)
                  await search('input[name=street_name]:visible',street)
                print('ADDRESS_RESULTS',town,[await x.get_attribute('data-id') for x in await pg.locator('a.view_app:visible').all()],flush=True)
                for ident in ids:
                  a=pg.locator('a.Attachmentclass[data-id="'+ident+'"]:visible').first
                  if not await a.count():
                    print('NO_CONTROL',ident,flush=True);continue
                  try:
                    await a.click()
                    await pg.wait_for_timeout(1500)
                    m=pg.locator('#AttachmentModal')
                    links=m.locator('a[data-href][data-download]:visible,a.downloadLink[data-size]:visible')
                    names=await links.all_text_contents()
                    print('FILES',ident,len(names),flush=True)
                    for j,name in enumerate(names):
                      name=name.strip()
                      if not re.search(r'\.(pdf|jpe?g|png)$',name,re.I):continue
                      if ident in ['63108','63650','23365','23391'] and not re.search(r'contract|agreement|auth|affidavit',name,re.I):continue
                      try:
                        async with pg.expect_download(timeout=6500) as d:await links.nth(j).click(timeout=3000)
                        dl=await d.value
                        f='output/'+ident+'_'+re.sub(r'[^a-zA-Z0-9._-]','_',dl.suggested_filename)
                        await dl.save_as(f)
                        data=open(f,'rb').read()
                        assert data.startswith((b'%PDF-',b'\xff\xd8\xff',b'\x89PNG'))
                        print('VERIFIED',ident,os.path.splitext(f)[1],len(data),hashlib.sha256(data).hexdigest(),flush=True)
                      except Exception as e:print('DOWNLOAD_ERROR',ident,str(e)[:90],flush=True)
                    close=m.locator('[data-dismiss=modal]:visible').first
                    if await close.count():await close.click()
                  except Exception as e:print('MODAL_ERROR',ident,str(e)[:90],flush=True)
              await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: municipal-contracts
          path: output/
          retention-days: 1
