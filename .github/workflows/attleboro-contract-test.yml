name: Attleboro signed contract PDF test
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/attleboro-contract-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          pip -q install playwright pypdf
          python -m playwright install chromium
      - run: |
          mkdir -p output
          python - <<'PY'
          import asyncio,os,re,hashlib
          from playwright.async_api import async_playwright
          from pypdf import PdfReader
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              c=await b.new_context(accept_downloads=True)
              pg=await c.new_page()
              pg.set_default_timeout(7000)
              await pg.goto('https://permiteyes.us/attleboro/publicview.php',wait_until='domcontentloaded')
              await pg.wait_for_timeout(3500)
              inp=pg.locator('input[name=site_add]:visible,input[name=site_address]:visible').first
              await inp.fill('67 Woodstock');await inp.dispatch_event('keyup');await inp.press('Enter')
              await pg.wait_for_timeout(3000)
              for rid in ['52828','7301','24334','52829']:
                a=pg.locator(f'a.Attachmentclass[data-id="{rid}"]:visible')
                if not await a.count():continue
                print('RECORD',rid,await a.first.evaluate("e=>e.closest('tr').innerText"),flush=True)
                await a.first.click()
                m=pg.locator('#AttachmentModal')
                try:await m.locator('a[data-href]').first.wait_for(state='attached',timeout=8000)
                except:pass
                await pg.wait_for_timeout(1800)
                links=m.locator('a[data-href][data-download]:visible')
                names=await links.all_text_contents()
                print('FILES',rid,names,flush=True)
                for i,name in enumerate(names):
                  if not re.search(r'contract|agreement|proposal|signed|authorization|signature|estimate',name,re.I) or not name.strip().lower().endswith('.pdf'):continue
                  try:
                    async with pg.expect_download(timeout=12000) as d:await links.nth(i).click()
                    dl=await d.value
                    f='output/'+rid+'_'+re.sub(r'[^a-zA-Z0-9._-]','_',dl.suggested_filename)
                    await dl.save_as(f)
                    data=open(f,'rb').read();assert data.startswith(b'%PDF-')
                    reader=PdfReader(f)
                    print('VERIFIED_CONTRACT',f,len(data),len(reader.pages),hashlib.sha256(data).hexdigest(),flush=True)
                    print('SIGNATURE_TEXT_PAGES',[j+1 for j,p in enumerate(reader.pages) if re.search(r'signature|signed by|accepted by|docusign',p.extract_text() or '',re.I)],flush=True)
                    if len(reader.pages)==4:await b.close();return
                  except Exception as e:print('DOWNLOAD_ERROR',str(e)[:250],flush=True)
                close=m.locator('[data-dismiss=modal]:visible').first
                if await close.count():await close.click()
                await pg.wait_for_timeout(350)
              await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: attleboro-contract-original
          path: output/
          if-no-files-found: error
