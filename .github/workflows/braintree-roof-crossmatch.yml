name: Braintree independent roofing index crossmatch
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/braintree-roof-crossmatch.yml']
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: pip -q install playwright pypdf cryptography && python -m playwright install chromium
      - run: |
          python -u - <<'PY'
          PUBLIC_KEY="-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAzTRFM3sYczJPrWEyU3Qs\nMSitKYFrltykYF7Igm1inmjba5ufJI4RbdrSVhNfaEn5qEQTXSTQmjzDAc4sedgi\n5TsgRkvkwX5WP9hufgDgdpAipa5PsWwSKXAjNfeAzIVVpyYwffwFR5M1fPKybZBy\nDHHWPOcl2WiYDSA6x7A3DgBeeleUNugGDTnxoaeJgFkIMws8v/R3qhxWqY2uieHS\nQLM08rPIBNNuy1BvomHGlfi7t7kUPaPJK3uaNvgR7RNt575+oH3ZnbhSNJ23zieE\nYQEMGi967/BOwsDA45lJGY2UBjDGFlG+7SD724j0srqvwWk7xhN4FUhp46fDclRx\nNQIDAQAB\n-----END PUBLIC KEY-----\n".encode()
          import asyncio,os,re,json,hashlib,datetime,io,zipfile
          from playwright.async_api import async_playwright
          from pypdf import PdfReader
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from pathlib import Path
          def norm(s):
              s=s.lower().strip()
              for a,b in [('street','st'),('road','rd'),('drive','dr'),('avenue','ave'),('lane','ln'),('court','ct'),('place','pl'),('terrace','ter')]:s=re.sub(r'\b'+a+r'\b',b,s)
              return re.sub(r'[^a-z0-9]','',s)
          def date(s):
              for fmt in ('%m/%d/%y','%m/%d/%Y'):
                  try:return datetime.datetime.strptime(s,fmt)
                  except ValueError:pass
              return None
          exclude=re.compile(r'insurance|certificate.of.insurance|(^|[^a-z])coi([^a-z]|$)|workers?.?comp|w.?c.?affidavit|debris|disposal|dumpster|building.plan|structural.plan|solar.plan|pv.plan|drawing|engineering.plan|plan.set|license|licence',re.I)
          include=re.compile(r'contract|agreement|proposal|estimate|signed|authoriz|change.?order|customer|confirmation|(^|[^a-z])cap([^a-z]|$)|permit|application',re.I)
          roof=re.compile(r'\bre.?roof|\broof(?:ing)?\s+(?:replacement|repair|tear|shingle|work)|replace.{0,35}roof|strip.{0,35}roof|shingle|giga|espigar',re.I)
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch()
                  c=await b.new_context(accept_downloads=True)
                  pg=await c.new_page()
                  pg.set_default_timeout(8000)
                  await pg.goto('https://permiteyes.us/braintree/publicview.php',wait_until='domcontentloaded')
                  await pg.wait_for_timeout(3500)
                  table=pg.locator('#PublicHome:visible,#BuildingPublicHome:visible').first
                  heads=[s.strip().lower() for s in await table.locator('thead tr').first.locator('th').all_text_contents()]
                  print('HEADERS',heads,flush=True)
                  def val(cs,*names):
                      i=next((i for i,s in enumerate(heads) if s in names),-1)
                      return cs[i] if 0<=i<len(cs) else ''
                  def unpack(r):
                      cs=r['cells']
                      return dict(r,address=val(cs,'site address'),applicant=val(cs,'applicant name','applicant'),date=val(cs,'appl. date','application date'),description=val(cs,'brief description'),type=val(cs,'appl. type','application type'),number=val(cs,'permit number'))
                  async def rows():
                      return await table.locator('tbody tr:has(a.view_app):visible').evaluate_all("""es=>es.map(e=>({cells:[...e.querySelectorAll('td')].map(x=>x.textContent.trim()),id:e.querySelector('a.view_app').dataset.id,attachment:!!e.querySelector('a.Attachmentclass[title="Attachment(s) present"]')}))""")
                  async def info():
                      return await table.evaluate("""e=>{let d=jQuery(e).DataTable(),i=d.page.info();return {page:i.page,pages:i.pages,records:i.recordsDisplay,length:i.length,serverSide:i.serverSide,search:d.search(),columns:d.columns().search().toArray()}}""")
                  async def draw(js,arg):
                      # Wait for the actual DataTables draw, not an arbitrary sleep.
                      await table.evaluate(js,arg)
                      await pg.wait_for_timeout(400)
                  async def search_field(field,q,global_mode=False):
                      idx=heads.index(field)
                      await draw("""(e,a)=>new Promise((resolve,reject)=>{const d=jQuery(e).DataTable();let t=setTimeout(()=>reject(Error('DataTables draw timeout')),18000);jQuery(e).one('draw.dt',()=>{clearTimeout(t);resolve()});d.search('');d.columns().search('');d.page.len(100);if(a.global)d.search(a.q);else d.column(a.idx).search(a.q);d.draw();})""",{'idx':idx,'q':q,'global':global_mode})
                  async def collect(limit=100):
                      records={};complete=False
                      for k in range(limit):
                          rr=await rows()
                          for r in rr:records[r['id']]=unpack(r)
                          meta=await info()
                          if meta['page']+1>=meta['pages']:
                              complete=len(records)==meta['records'];break
                          await draw("""(e,_)=>new Promise((resolve,reject)=>{const d=jQuery(e).DataTable();let t=setTimeout(()=>reject(Error('pagination draw timeout')),18000);jQuery(e).one('draw.dt',()=>{clearTimeout(t);resolve()});d.page('next').draw('page');})""",None)
                      return list(records.values()),complete,meta['records']
                  async def query(field,q,match,limit=100):
                      # Try server-side column filter, global search, and the scoped real UI input.
                      for mode in ['column','global','ui']:
                          try:
                              if mode=='ui':
                                  await search_field(field,'')
                                  names={'applicant name':'applicant_name','brief description':'briefDesc','site address':'site_add'}
                                  inp=table.locator('input[name="'+names[field]+'"]:visible').last
                                  if not await inp.count():continue
                                  await inp.fill(q);await inp.dispatch_event('input');await inp.dispatch_event('change');await inp.dispatch_event('keyup');await inp.press('Enter');await pg.wait_for_timeout(2000)
                              else:await search_field(field,q,mode=='global')
                              sample=[unpack(r) for r in await rows()]
                              meta=await info()
                              # A nonempty unfiltered sample is not proof of search.
                              good=sum(bool(match(r)) for r in sample)
                              print('FILTER_CHECK',json.dumps({'field':field,'term':q,'mode':mode,'sample':len(sample),'matching':good,'reported':meta['records']}),flush=True)
                              if sample and not good:continue
                              if sample and good<len(sample) and mode!='global':continue
                              if not sample and mode!='ui':continue
                              rs,complete,total=await collect(limit)
                              valid=[r for r in rs if match(r)]
                              if rs and not valid:continue
                              return valid,complete,total,mode
                          except Exception as ex:print('FILTER_ERROR',field,mode,type(ex).__name__,flush=True)
                      return [],False,0,'unverified'
                  suns={};roofs={};coverage=[]
                  # Global searches are the proven working filter in this portal.
                  for term in ['solar','photovoltaic','roof','shingle','reroof']:
                      await search_field('brief description',term,True)
                      rs,complete,total=await collect(100)
                      coverage.append({'term':term,'rows':len(rs),'complete':complete,'reported':total})
                      for r in rs:
                          if not date(r['date']) or date(r['date']).year<2022 or not r['address']:continue
                          if re.search(r'\bsolar\b|photovoltaic|\bpv\b',r['description'],re.I):suns[r['id']]=r
                          elif roof.search(r['description']) or re.search(r'\broof\b',r['description'],re.I):roofs[r['id']]=r
                  pairs=[]
                  for s in suns.values():
                      for r in roofs.values():
                          if norm(s['address'])==norm(r['address']) and abs((date(s['date'])-date(r['date'])).days)<=365:pairs.append((s,r))
                  pairs.sort(key=lambda sr:(bool(re.search('giga|espigar',sr[1]['applicant'],re.I)),bool(sr[0]['attachment'] and sr[1]['attachment']),date(sr[0]['date'])),reverse=True)
                  print('CROSSMATCH',json.dumps({'solar':len(suns),'roof':len(roofs),'pairs':len(pairs),'coverage':coverage}),flush=True)
                  async def address_search(rec):
                      # Reopen exact row using global address search and page through results.
                      addr=rec['address']
                      for term in [addr, ' '.join(addr.split()[:2])]:
                          await search_field('site address',term,True)
                          for _ in range(20):
                              a=table.locator('a.Attachmentclass[data-id="'+rec['id']+'"]:visible').first
                              if await a.count():return a
                              meta=await info()
                              if meta['page']+1>=meta['pages']:break
                              await draw("""(e,_)=>new Promise((resolve,reject)=>{const d=jQuery(e).DataTable();let t=setTimeout(()=>reject(Error('pagination draw timeout')),18000);jQuery(e).one('draw.dt',()=>{clearTimeout(t);resolve()});d.page('next').draw('page');})""",None)
                      return table.locator('a.Attachmentclass[data-id="'+rec['id']+'"]:visible').first
                  suns=list(suns.values());roofs=list(roofs.values())
                  buf=io.BytesIO();manifest=[];downloaded=0
                  with zipfile.ZipFile(buf,'w',zipfile.ZIP_DEFLATED) as z:
                      z.writestr('crossmatch.json',json.dumps({'coverage':coverage,'solar':suns,'roofs':roofs,'pairs':pairs},indent=2))
                      # Inspect paired solar permits first. Only retain a property if Sunrun is confirmed in original PDF.
                      seen=set();confirmed=0;attempts=0
                      for s,r in pairs[:30]:
                          if norm(s['address']) in seen:continue
                          seen.add(norm(s['address']))
                          attempts+=1;docs=[];solar_confirmed=False
                          for rec in [s,r]:
                              if rec is r and not solar_confirmed:break
                              a=await address_search(rec)
                              if not await a.count():continue
                              await a.click();await pg.wait_for_timeout(1500)
                              modal=pg.locator('#AttachmentModal')
                              links=modal.locator('a.downloadLink[data-size]:visible,a[data-href][data-download]:visible')
                              print('ATTACHMENT_COUNT', 'solar' if rec is s else 'roof',await links.count(),flush=True)
                              for i in range(min(await links.count(),40)):
                                  l=links.nth(i);name=(await l.inner_text()).strip()
                                  if not name.lower().endswith('.pdf') or exclude.search(name) or re.search(r'\bplans?\b|schematic|layout|engineering|certificate.of.completion|installation.methods|affidavit',name,re.I):continue
                                  # Ambiguous PDFs are not automatically rejected; verify actual content.
                                  try:
                                      async with pg.expect_download(timeout=12000) as event:await l.click(timeout=5000)
                                      d=await event.value;data=Path(await d.path()).read_bytes()
                                      if not data.startswith(b'%PDF-'):continue
                                      reader=PdfReader(io.BytesIO(data));pages=len(reader.pages)
                                      if not pages:continue
                                      texts=[x.extract_text() or '' for x in reader.pages]
                                      txt='\n'.join(texts)
                                      relevant=bool(include.search(name) or re.search(r'customer agreement|roofing contract|home improvement contract|change order|power purchase agreement|permit application|customer confirmation package|authorization letter|roofing estimate',txt,re.I))
                                      if not relevant:continue
                                      sr=bool(re.search(r'\bsun\s*run\b',txt,re.I))
                                      if rec is s and sr:solar_confirmed=True
                                      sha=hashlib.sha256(data).hexdigest()
                                      item={'application':rec['id'],'filename':name,'pages':pages,'sha256':sha,'bytes':len(data),'sunrun_text':sr,'status':'verified_original','archive_file':rec['id']+'/'+re.sub(r'[^a-zA-Z0-9._-]','_',name)}
                                      docs.append((item,data))
                                      print('PDF_CHECK',json.dumps({'role':'solar' if rec is s else 'roof','pages':pages,'sunrun_text':sr,'contract_terms':bool(re.search(r'contract|agreement',txt,re.I)),'hash':sha}),flush=True)
                                  except Exception as e:print('PDF_ERROR',type(e).__name__,flush=True)
                              close=modal.locator('[data-dismiss=modal]:visible').first
                              if await close.count():await close.click()
                          if solar_confirmed:
                              confirmed+=1
                              for item,data in docs:
                                  z.writestr(item['archive_file'],data);manifest.append(item);downloaded+=1
                              z.writestr('confirmed_property.json',json.dumps({'solar':s,'roof':r},indent=2))
                              break
                      print('PROPERTY_SCREEN',json.dumps({'attempted':attempts,'sunrun_confirmed':confirmed}),flush=True)
                      z.writestr('manifest.json',json.dumps(manifest,indent=2))
                  await b.close()
                  pub=serialization.load_pem_public_key(PUBLIC_KEY)
                  key=AESGCM.generate_key(bit_length=256);nonce=os.urandom(12)
                  out=Path('encrypted');out.mkdir()
                  (out/'key.enc').write_bytes(pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None)))
                  (out/'evidence.enc').write_bytes(nonce+AESGCM(key).encrypt(nonce,buf.getvalue(),None))
                  print('RESULT',json.dumps({'pairs':len(pairs),'properties_downloaded':confirmed,'verified_originals':downloaded,'eligible_attachments':len(manifest)}),flush=True)
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: braintree-roof-crossmatch-encrypted
          path: encrypted/
          retention-days: 7
