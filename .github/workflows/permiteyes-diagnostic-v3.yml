name: PermitEyes nested icon diagnostic
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/permiteyes-diagnostic-v3.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        town: [bedford, stoughton]
    steps:
      - run: |
          pip -q install playwright pypdf
          python -m playwright install chromium
      - env:
          TOWN: ${{ matrix.town }}
        run: |
          mkdir -p output
          python - <<'PY'
          import asyncio,os,re,json,hashlib
          from playwright.async_api import async_playwright
          from pypdf import PdfReader
          town=os.environ['TOWN']
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              ctx=await b.new_context(accept_downloads=True)
              pg=await ctx.new_page()
              pg.set_default_timeout(5000)
              r=await pg.goto('https://permiteyes.us/'+town+'/publicview.php',wait_until='domcontentloaded',timeout=35000)
              await pg.wait_for_timeout(4000)
              print('PORTAL',r.status,pg.url,await pg.title(),(await pg.locator('body').inner_text())[:200],flush=True)
              print('TABLES',await pg.locator('table:visible').evaluate_all("es=>es.map(e=>({id:e.id,rows:e.querySelectorAll('tbody tr').length,headers:[...e.querySelectorAll('thead tr:first-child th')].map(x=>x.textContent.trim())}))"),flush=True)
              print('CONTROLS',await pg.locator('table:visible tbody tr a:visible').evaluate_all("es=>{let m={};for(let e of es){let k=[e.className,e.title,e.getAttribute('data-target'),e.getAttribute('data-toggle')].join('|');m[k]=(m[k]||0)+1}return m}"),flush=True)
              print('PAPERCLIPS',await pg.locator('a.Attachmentclass:visible').evaluate_all("es=>es.slice(0,4).map(e=>e.outerHTML)"),flush=True)
              await pg.screenshot(path='output/portal.png')
              verified=False
              for k in range(2):
                rows=pg.locator('tr:has(a.Attachmentclass:is([title="Attachment(s) present"],:has([title="Attachment(s) present"]))):visible')
                for i in range(min(await rows.count(),10)):
                  row=rows.nth(i)
                  record=await row.inner_text()
                  if not re.search(r'building|roof|residential|construction|solar|alteration|RESI',record,re.I):continue
                  a=row.locator('a.Attachmentclass:is([title="Attachment(s) present"],:has([title="Attachment(s) present"]))').first
                  print('RECORD',await a.get_attribute('data-id'),record.replace(chr(10),' '),flush=True)
                  await a.click()
                  m=pg.locator('#AttachmentModal')
                  await pg.wait_for_timeout(1700)
                  print('MODAL', (await m.inner_text())[:500],await m.locator('a').evaluate_all("es=>es.slice(0,15).map(e=>({text:e.textContent.trim(),attrs:[...e.attributes].map(a=>[a.name,a.value])}))"),flush=True)
                  links=m.locator('a[data-href][data-download]:visible,a.downloadLink[data-size]:visible')
                  for j in range(min(await links.count(),12)):
                    l=links.nth(j)
                    name=(await l.inner_text()).strip()
                    if not name.lower().endswith('.pdf'):continue
                    try:
                      async with pg.expect_download(timeout=7000) as dl:await l.click(timeout=4000)
                      d=await dl.value
                      f='output/'+re.sub(r'[^a-zA-Z0-9._-]','_',d.suggested_filename)
                      await d.save_as(f)
                      data=open(f,'rb').read()
                      assert data.startswith(b'%PDF-')
                      print('VERIFIED',f,len(data),len(PdfReader(f).pages),hashlib.sha256(data).hexdigest(),flush=True)
                      verified=True
                      break
                    except Exception as e:print('ERROR',str(e)[:160],flush=True)
                  if verified:break
                  close=m.locator('[data-dismiss=modal]:visible').first
                  if await close.count():await close.click()
                if verified:break
                nxt=pg.locator('.paginate_button.next:visible:not(.disabled)').first
                if not await nxt.count():break
                await nxt.click();await pg.wait_for_timeout(800)
              print('DOWNLOAD_VERIFIED',verified,flush=True)
              await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-diagnostic-${{ matrix.town }}
          path: output/
