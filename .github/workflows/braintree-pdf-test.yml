name: Braintree original PDF proof
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/braintree-pdf-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: |
          pip -q install playwright pypdf
          python -m playwright install chromium
      - run: |
          mkdir -p output
          python - <<'PY'
          import asyncio,os,re,hashlib
          from playwright.async_api import async_playwright
          from pypdf import PdfReader
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              c=await b.new_context(accept_downloads=True)
              pg=await c.new_page()
              await pg.goto('https://permiteyes.us/braintree/publicview.php',wait_until='domcontentloaded',timeout=45000)
              await pg.wait_for_timeout(4000)
              inp=pg.locator('input[name=site_add]:visible').first
              await inp.fill('18 Eleanor')
              await inp.dispatch_event('keyup')
              await inp.press('Enter')
              await pg.wait_for_timeout(3000)
              rows=pg.locator('tr:has(a.Attachmentclass)').filter(has_text=re.compile(r'18\s+Eleanor',re.I))
              print('MATCHES',await rows.count(),flush=True)
              for i in range(min(await rows.count(),8)):
                row=rows.nth(i)
                print('RECORD',await row.evaluate('e=>e.textContent.trim()'),flush=True)
                a=row.locator('a.Attachmentclass[title="Attachment(s) present"]')
                if not await a.count():continue
                await a.first.click(timeout=7000)
                m=pg.locator('#AttachmentModal')
                await pg.wait_for_timeout(1800)
                links=m.locator('a.downloadLink[data-size]:visible')
                print('FILES',await links.evaluate_all('es=>es.map(e=>({name:e.textContent, size:e.dataset.size}))'),flush=True)
                for j in range(min(await links.count(),8)):
                  l=links.nth(j)
                  name=(await l.inner_text()).strip()
                  if not name.lower().endswith('.pdf'):continue
                  try:
                    async with pg.expect_download(timeout=12000) as dl:
                      await l.click(timeout=5000)
                    d=await dl.value
                    f='output/'+re.sub(r'[^a-zA-Z0-9._-]','_',d.suggested_filename)
                    await d.save_as(f)
                    data=open(f,'rb').read()
                    n=len(PdfReader(f).pages)
                    print('VERIFIED',f,len(data),data[:8],n,hashlib.sha256(data).hexdigest(),flush=True)
                    if n==18 or 'contract' in name.lower():
                      await b.close()
                      return
                  except Exception as e:print('ERROR',str(e)[:200],flush=True)
                close=m.locator('button[data-dismiss=modal]:visible').first
                if await close.count():await close.click()
                await pg.wait_for_timeout(600)
              await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: braintree-original-pdf
          path: output/
          if-no-files-found: ignore
