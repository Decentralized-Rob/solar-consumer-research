name: Giga public permit portal access matrix
on:
  push:
    branches:
      - research/barnstable-laserfiche-20261122
    paths:
      - "tools/giga_platform_public_probe.py"
      - ".github/workflows/giga-public-portals.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect public-facing portal access
        run: python -u tools/giga_platform_public_probe.py
      - name: Preserve access matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giga-massachusetts-portal-public-access-matrix
          path: giga_portal_public_probe/
          retention-days: 7
          if-no-files-found: warn
