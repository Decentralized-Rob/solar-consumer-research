name: Bellingham single original PDF retrieval preflight
on:
  push:
    branches: [research/permitpro-sunrun-giga]
    paths: ['.github/workflows/26-solar-permit-file-recovery.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          python -m pip install -q playwright pymupdf
          python -m playwright install chromium
      - name: Download exactly one known original PDF
        run: |
          mkdir -p output
          python -u - <<'PY'
          import asyncio, hashlib, json
          from pathlib import Path
          from playwright.async_api import async_playwright
          import pymupdf
          ROOT=Path("output")
          AID="93018"
          FILENAME="CE LETTER STAMPED.pdf"
          EXPECTED="b5c7175ab3a8e11d96baed3922405ff691d15fce03dfd4bd87b33a944b73af90"
          result={"town":"Bellingham","application":AID,"permit":"S-25-0071","filename":FILENAME,"expected_sha256":EXPECTED,"attachment_download_attempts":0,"verified_originals":0,"status":"not_started"}
          def checkpoint():
              (ROOT/"manifest.json").write_text(json.dumps(result,indent=2))
          async def main():
              async with async_playwright() as p:
                  b=await p.chromium.launch(headless=True)
                  ctx=await b.new_context(accept_downloads=True)
                  pg=await ctx.new_page()
                  try:
                      await pg.goto("https://permiteyes.us/bellingham/publicview.php",wait_until="domcontentloaded",timeout=45000)
                      await pg.wait_for_timeout(2200)
                      search=pg.locator('input[type="search"][aria-controls="BuildingPublicHome"]')
                      await search.fill("46 Pickering")
                      await search.press("Enter")
                      rows=pg.locator("#BuildingPublicHome tbody tr")
                      row=rows.filter(has=pg.locator('td:nth-child(4) span[data-id="93018"]')).first
                      await row.wait_for(timeout=15000)
                      cells=await row.locator("td").all_inner_texts()
                      assert cells[3].strip()==AID and "Pickering" in cells[6] and "Sunrun" in cells[7], "Unexpected record identity"
                      assert cells[10].strip()=="S-25-0071","Unexpected permit number"
                      await row.locator("a.Attachmentclass").first.click(timeout=8000)
                      modal=pg.locator("#AttachmentModal")
                      await modal.wait_for(state="visible",timeout=10000)
                      link=modal.locator('a.downloadLink[data-href][data-download="CE LETTER STAMPED.pdf"]').first
                      await link.wait_for(timeout=10000)
                      result["attachment_download_attempts"]=1
                      checkpoint()
                      # Exactly one click and one attachment download. No fallback or retries.
                      async with pg.expect_download(timeout=35000) as di:
                          await link.click(timeout=10000)
                      download=await di.value
                      await download.save_as(ROOT/FILENAME)
                      data=(ROOT/FILENAME).read_bytes()
                      assert data.startswith(b"%PDF-"),"Not a PDF"
                      with pymupdf.open(stream=data,filetype="pdf") as doc:
                          assert len(doc)>0,"Empty PDF"
                          result["pages"]=len(doc)
                      result.update({"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"verified_originals":1})
                      result["hash_matches_archive"]=result["sha256"]==EXPECTED
                      result["status"]="pass" if result["hash_matches_archive"] and len(data)==391349 and result["pages"]==1 else "source_changed_review_required"
                      checkpoint()
                      print("PREFLIGHT_RESULT",json.dumps(result),flush=True)
                      if result["status"]!="pass":raise RuntimeError("Original differs from archived control")
                  except Exception as e:
                      if result["status"]!="source_changed_review_required":
                          result["status"]="failed"
                          result["error"]=str(e)[:400]
                          if not result["verified_originals"]:(ROOT/FILENAME).unlink(missing_ok=True)
                      checkpoint()
                      print("PREFLIGHT_RESULT",json.dumps(result),flush=True)
                      raise
                  finally:
                      await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bellingham-single-pdf-preflight
          path: output/
          retention-days: 7
