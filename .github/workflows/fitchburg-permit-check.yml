name: Fitchburg official permit check
on:
  push:
    branches: [research/fitchburg-permit-check-20261128]
    paths: [.github/workflows/fitchburg-permit-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 playwright
      - run: python -m playwright install --with-deps chromium
      - name: Follow Fitchburg official permit links
        run: |
          mkdir -p evidence
          cat > /tmp/check.py <<'PY'
          import requests,json,pathlib,time
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('evidence')
          urls=['https://www.fitchburgma.gov/197/Building-Zoning','https://www.fitchburgma.gov/874/E-Permitting-and-Emergency-Resources','https://www.fitchburgma.gov/885/Permit-Applications']
          ledger=[]
          targets={}
          for i,url in enumerate(urls):
              r=requests.get(url,timeout=60)
              (out/f'city-{i}.html').write_text(r.text)
              soup=BeautifulSoup(r.text,'html.parser')
              links=[{'text':a.get_text(' ',strip=True),'url':a.get('href')} for a in soup.select('a[href]') if any(t in a.get('href','') for t in ['viewpointcloud','portal.opengov'])]
              ledger.append({'city_url':url,'status':r.status_code,'links':links})
              for link in links:
                  if link['url'].startswith('https://') and ('Building Permit Application' in link['text'] or link['url'].rstrip('/')=='https://fitchburgma.viewpointcloud.com'):
                      targets[link['url']]=link['text']
          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page()
              for i,(url,label) in enumerate(targets.items()):
                  try:
                      res=page.goto(url,wait_until='domcontentloaded',timeout=60000)
                      page.wait_for_timeout(10000)
                      text=page.locator('body').inner_text()
                      (out/f'portal-{i}.txt').write_text(text)
                      page.screenshot(path=str(out/f'portal-{i}.png'),full_page=True)
                      item={'url':url,'label':label,'final_url':page.url,'status':res.status if res else None,'text':text[:15000]}
                      ledger.append(item)
                      print(json.dumps(item))
                  except Exception as e:
                      ledger.append({'url':url,'error':str(e)})
              browser.close()
          (out/'findings.json').write_text(json.dumps(ledger,indent=2))
          print('Official city links checked. No record absence inference may be made from an unavailable portal.')
          PY
          python /tmp/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fitchburg-official-permit-check
          path: evidence/
          retention-days: 30
