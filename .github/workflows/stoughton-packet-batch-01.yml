name: Stoughton permit packet batch 01
on:
  push:
    branches: [research/permitlink-sterling-20261127]
    paths: [.github/workflows/stoughton-packet-batch-01.yml]
permissions:
  contents: read
  actions: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stoughton-105-canton-pilot
          run-id: 46083846121
          github-token: ${{ github.token }}
          path: pilot
      - run: pip -q install playwright pypdf && python -m playwright install chromium
      - run: |
          python -u - <<'PY'
          import asyncio,re,json,hashlib,io,shutil
          from pathlib import Path
          from playwright.async_api import async_playwright
          from pypdf import PdfReader
          O=Path('output');O.mkdir(exist_ok=True)
          URL='https://permiteyes.us/stoughton/publicview.php'
          ROW='tr:has(a.view_app):visible'
          LINK='a.downloadLink[data-size]:visible,a[data-href][data-download]:visible'
          EX=re.compile(r'insurance|liability|workers?[ _-]*comp|wcomp|work.?comp|debris|disposal|(?:^|[ _.-])(?:coi|wca|acord|plans?|drawings?)(?:[ _.-]|$)|solar[ _-]*design|site[ _-]*design|roof[ _-]*design|^AC\d{4,}|equipment.*spec|datasheet|service manual|emergency response guide|UL[ _-]*9540|new creds|HIC cards|CSL lic',re.I)
          CON=re.compile(r'contract|agreement|proposal|estimate|change.?order|customer.?approval|\bPPA\b|\bCAP\b',re.I)
          ROOF=re.compile(r'roof|shingl|reroof',re.I)
          EXCONTENT=re.compile(r'ACORD\s+CERTIFICATE OF LIABILITY INSURANCE|CERTIFICATE OF LIABILITY INSURANCE|WORKERS.? COMPENSATION INSURANCE AFFIDAVIT|CONSTRUCTION DEBRIS DISPOSAL AFFIDAVIT',re.I)
          manifest=[];errors=[];records=[]
          def safe(x):return re.sub(r'[^A-Za-z0-9._-]+','_',str(x))[:150]
          def save():
           for n,a in [('manifest',manifest),('errors',errors),('records',records)]: (O/(n+'.json')).write_text(json.dumps(a,indent=2))
          def examine(f,pid,name,rec):
           data=f.read_bytes()
           if not data.startswith(b'%PDF-'):f.unlink();return
           r=PdfReader(io.BytesIO(data));texts=[p.extract_text() or '' for p in r.pages];t='\n'.join(texts)
           if EXCONTENT.search(t[:2000]) and not re.search(r'power purchase agreement|home improvement contract|roofing contract',t,re.I):
            f.unlink();manifest.append({'permit':pid,'name':name,'status':'excluded by content'});save();return
           typ='document'
           if re.search(r'power purchase agreement|solar lease|solar service agreement',t,re.I):typ='solar agreement'
           elif re.search(r'customer approved project|customer approval|change order',t,re.I):typ='CAP/change order candidate'
           elif ROOF.search(t) and re.search(r'contract|proposal|estimate|agreement|acceptance|payment|total',t,re.I):typ='roof contract/estimate candidate'
           elif CON.search(name):typ='contract candidate'
           elif len(t.strip())<100:typ='image-only PDF; visual review required'
           evidence=[]
           for i,s in enumerate(texts,1):
            for line in s.splitlines():
             if re.search(r'@|\b\d{3}[-. ]\d{3}[-. ]\d{4}\b|\b(?:\d{1,3}\.){3}\d{1,3}\b',line):continue
             if re.search(r'roof|shingle|contract|agreement|estimate|proposal|payment|deposit|balance|subsid|signature|sales representative|sales consultant|cancel|start date|completion date|guaranty fund|registration|total price|customer approved project',line,re.I):
              evidence.append({'page':i,'text':line.strip()[:220]})
              if len(evidence)>=30:break
            if len(evidence)>=30:break
           item={'permit':pid,'record':rec,'name':name,'file':str(f.relative_to(O)),'status':'downloaded','type':typ,'pages':len(r.pages),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'text_chars':len(t),'evidence':evidence}
           manifest.append(item);save()
           print('VERIFIED',json.dumps({k:v for k,v in item.items() if k not in ('record','evidence')}),flush=True)
           if typ in ('roof contract/estimate candidate','solar agreement','contract candidate','CAP/change order candidate'):print('EVIDENCE',pid,json.dumps(evidence),flush=True)
          async def fill(p,n,v):
           l=p.locator(f'input[name="{n}"]:visible').first
           await l.wait_for(state='visible',timeout=12000);await l.fill(v);await l.dispatch_event('keyup');await l.press('Enter');await p.wait_for_timeout(1000)
          async def home(p):
           await p.goto(URL,wait_until='domcontentloaded',timeout=20000);await p.wait_for_timeout(1200)
          async def search_addr(p,num,street):
           await home(p);await fill(p,'street_no',num);await fill(p,'street_name',street)
          async def get_rows(p):
           return await p.locator(ROW).evaluate_all("""es=>es.map(e=>({cells:[...e.querySelectorAll('td')].map(x=>x.textContent.trim()),record:e.innerText,id:e.querySelector('a.view_app').dataset.id}))""")
          def pid_of(r):
           m=re.search(r'\b[A-Z]+-2[2-6]-\d+\b',r['record']);return m.group() if m else ''
          async def packet(p,r,folder):
           pid=pid_of(r);row=p.locator(ROW).filter(has_text=pid).first
           if not await row.count():raise RuntimeError('row absent')
           icon=row.locator('a.Attachmentclass')
           if not await icon.count():return
           await icon.first.click(timeout=5000)
           m=p.locator('#AttachmentModal');await m.wait_for(state='visible',timeout=7000);await p.wait_for_timeout(500)
           links=m.locator(LINK);names=await links.all_text_contents()
           (folder/(pid+'_attachments.json')).write_text(json.dumps(names,indent=2))
           print('ATTACHMENTS',pid,json.dumps(names),flush=True)
           for i,n in enumerate(names):
            n=n.strip()
            if not n.lower().endswith('.pdf') or (EX.search(n) and not CON.search(n)):
             manifest.append({'permit':pid,'name':n,'status':'excluded'});save();continue
            try:
             # Click PDF only; image attachment clicks may navigate away from the modal.
             async with p.expect_download(timeout=8000) as dl:await links.nth(i).click(timeout=4000)
             d=await dl.value;f=folder/(pid+'_'+str(i)+'_'+safe(d.suggested_filename));await d.save_as(f)
             examine(f,pid,n,r['record'])
            except Exception as e:errors.append({'permit':pid,'name':n,'error':str(e)[:350]});save()
          async def property_job(b,target):
           c=await b.new_context(accept_downloads=True);p=await c.new_page()
           try:
            if isinstance(target,str):
             await home(p);await fill(p,'permit_num',target)
             row=p.locator(ROW).filter(has_text=target).first;await row.wait_for(timeout=6000)
             cols=await row.locator('td').all_inner_texts();num,street=cols[10].strip(),cols[11].strip()
            else:num,street=target
            await search_addr(p,num,street)
            rs=await get_rows(p)
            rs=[r for r in rs if len(r['cells'])>14 and r['cells'][10].lower()==num.lower() and r['cells'][11].lower()==street.lower() and pid_of(r)]
            folder=O/safe(num+'_'+street);folder.mkdir(exist_ok=True)
            (folder/'property_records.json').write_text(json.dumps(rs,indent=2))
            records.extend(rs);save()
            for r in rs:
             if 'sunrun' not in r['record'].lower() and 'BUILD' not in r['record'].upper():continue
             try:
              await search_addr(p,num,street);await packet(p,r,folder)
             except Exception as e:errors.append({'permit':pid_of(r),'error':str(e)[:350]});save()
           except Exception as e:errors.append({'target':target,'error':str(e)[:350]});save()
           finally:await c.close()
          async def main():
           # Inspect the generic roof PDF already recovered by the pilot.
           for f in Path('pilot').rglob('B-25-0728_0_*.pdf'):
            folder=O/'105_Canton_St';folder.mkdir(exist_ok=True);dest=folder/f.name;shutil.copy2(f,dest)
            examine(dest,'B-25-0728',f.name,'prior pilot original')
           async with async_playwright() as pw:
            b=await pw.chromium.launch()
            # Four bounded property targets, no town-wide retrieval.
            await asyncio.gather(*(property_job(b,t) for t in [('105','Canton St'),('39','Kelsey Dr'),'B-26-1191','B-26-0989']))
            await b.close()
           save()
           print('BATCH SUMMARY',sum(x.get('status')=='downloaded' for x in manifest),'downloaded',len(errors),'errors',flush=True)
           if not any(x.get('status')=='downloaded' for x in manifest):raise RuntimeError('No original documents')
          asyncio.run(asyncio.wait_for(main(),230))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stoughton-packet-batch-01
          path: output/
          retention-days: 14
