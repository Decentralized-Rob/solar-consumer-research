name: Milton two matched roofing original document packets v2
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/milton-roof-packets-v2.yml']
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        town: [milton]
    steps:
      - run: |
          pip -q install playwright pypdf
          python -m playwright install chromium
      - env:
          TOWN: ${{ matrix.town }}
        run: |
          mkdir -p output
          python - <<'PY'
          import asyncio,os,re,json,hashlib,datetime
          from playwright.async_api import async_playwright
          from pypdf import PdfReader
          town=os.environ['TOWN']
          def norm(s):
            s=s.lower().strip()
            for a,b in [('street','st'),('road','rd'),('drive','dr'),('avenue','ave'),('lane','ln'),('court','ct'),('place','pl'),('terrace','ter')]:
              s=re.sub(r'\b'+a+r'\b',b,s)
            return re.sub(r'[^a-z0-9]','',s)
          def date(s):
            try:return datetime.datetime.strptime(s,'%m/%d/%y')
            except:return None
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              c=await b.new_context(accept_downloads=True)
              pg=await c.new_page()
              pg.set_default_timeout(8000)
              await pg.goto('https://permiteyes.us/'+town+'/publicview.php',wait_until='domcontentloaded')
              await pg.wait_for_timeout(3000)
              table=pg.locator('#PublicHome:visible,#BuildingPublicHome:visible').first
              heads=await table.locator('thead tr').first.locator('th').all_text_contents()
              heads=[s.strip().lower() for s in heads]
              print('HEADERS',heads,flush=True)
              def ix(*names):
                return next((i for i,s in enumerate(heads) if s in names),-1)
              def unpack(r):
                cs=r['cells']
                def val(*names):
                  i=ix(*names)
                  return cs[i] if i>=0 and i<len(cs) else ''
                addr=val('site address') or (val('street no','street no.')+' '+val('street name')).strip()
                return dict(r,address=addr,applicant=val('applicant','applicant name'),date=val('appl. date','application date'),description=val('brief description'),type=val('appl. type','application type'),number=val('permit number'))
              async def collect(limit=35):
                records={}
                for k in range(limit):
                  rr=await table.locator('tbody tr:has(a.view_app):visible').evaluate_all("""es=>es.map(e=>({cells:[...e.querySelectorAll('td')].map(x=>x.textContent.trim()),id:e.querySelector('a.view_app').dataset.id,attachment:!!e.querySelector('a.Attachmentclass[title="Attachment(s) present"],a.Attachmentclass [title="Attachment(s) present"]')}))""")
                  for r in rr:records[r['id']]=unpack(r)
                  nxt=pg.locator('.paginate_button.next:visible:not(.disabled)').first
                  if not await nxt.count():break
                  await nxt.click();await pg.wait_for_timeout(350)
                return list(records.values())
              async def search(inp,q):
                await inp.fill(q);await inp.dispatch_event('keyup');await inp.press('Enter');await pg.wait_for_timeout(950)
              site=pg.locator('input[name=site_address]:visible,input[name=site_add]:visible').first
              street=pg.locator('input[name=street_name]:visible,input[name=streetname]:visible,input[name=street]:visible').first
              num=pg.locator('input[name=street_no]:visible,input[name=streetno]:visible,input[name=street_number]:visible,input[name=street_num]:visible').first
              desc=pg.locator('input[name=briefDesc]:visible,input[name=brief_desc]:visible').first
              print('INPUTS',await pg.locator('input:visible').evaluate_all('es=>es.map(e=>({name:e.name,id:e.id,cell:e.closest(\"th,td\")?.cellIndex}))'),flush=True)
              async def address_search(addr):
                if await site.count():await search(site,addr)
                else:
                  m=re.match(r'^(\S+)\s+(.+)$',addr)
                  if not m:return []
                  if await num.count() and await street.count():
                    await search(num,m.group(1));await search(street,m.group(2))
                  else:
                    idx=ix('street name')
                    col=table.locator('thead tr').last.locator('th,td').nth(idx).locator('input').first
                    if await col.count():await search(col,m.group(2))
                    else:
                      global_search=pg.locator('input[type=search]:visible').first
                      await search(global_search,m.group(2))
                return [r for r in await collect(6) if norm(r['address'])==norm(addr)]
              rr=await address_search('1749 canton ave')
              print('EXACT_ADDRESS_ROWS',json.dumps(rr),flush=True)
              open('output/exact_address.json','w').write(json.dumps(rr,indent=2))
              for r in rr:
                if not r['attachment']:continue
                if re.search('elect|plumb|gas',r['type'],re.I):continue
                a=table.locator('a.Attachmentclass[data-id="'+r['id']+'"]:visible').first
                if not await a.count():continue
                await a.click();await pg.wait_for_timeout(800)
                m=pg.locator('#AttachmentModal')
                links=m.locator('a[data-href][data-download]:visible,a.downloadLink[data-size]:visible')
                print('FILES',r['id'],await links.all_text_contents(),flush=True)
                for j in range(await links.count()):
                  l=links.nth(j)
                  try:
                    async with pg.expect_download(timeout=8000) as dl:await l.click(timeout=3500)
                    dd=await dl.value
                    fn='output/'+r['id']+'_'+re.sub(r'[^a-zA-Z0-9._-]','_',dd.suggested_filename)
                    await dd.save_as(fn)
                    data=open(fn,'rb').read()
                    print('DOWNLOADED',fn,len(data),data[:8],hashlib.sha256(data).hexdigest(),flush=True)
                  except Exception as e:print('DOWNLOAD_ERROR',str(e)[:150],flush=True)
                close=m.locator('[data-dismiss=modal]:visible').first
                if await close.count():await close.click()
              await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milton-1749-canton-${{ matrix.town }}
          path: output/
