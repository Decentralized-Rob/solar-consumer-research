name: Lowell 41 Grace municipal permit source recovery
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/lowell-grace-permit-recovery.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          pip -q install playwright
          python -m playwright install chromium
      - run: |
          mkdir -p evidence
          python -u - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json,re
          with sync_playwright() as p:
           b=p.chromium.launch()
           c=b.new_context(accept_downloads=True)
           pg=c.new_page()
           pg.goto("https://cityoflowellma.munisselfservice.com/css/",wait_until="domcontentloaded",timeout=45000)
           pg.wait_for_timeout(1500)
           def capture(name):
            t=pg.locator("body").inner_text()
            links=pg.locator("a[href]").evaluate_all("es=>es.map(e=>({text:e.innerText.trim(),href:e.href})).filter(x=>x.text)")
            print("PAGE",name,pg.url,t[:4000],json.dumps(links),flush=True)
            Path("evidence/"+name+".txt").write_text(pg.url+"\n"+t+"\n"+json.dumps(links,indent=2))
            pg.screenshot(path="evidence/"+name+".png",full_page=True)
            return links
           links=capture("home")
           for l in links:
            if re.search("permit|citizen self service",l["text"],re.I) and l["href"].startswith("https://cityoflowellma.munisselfservice.com/"):
             try:
              pg.goto(l["href"],wait_until="domcontentloaded",timeout=25000)
              pg.wait_for_timeout(700)
              capture("public_navigation_"+str(links.index(l)))
             except Exception as e:print("NAV_ERROR",str(e)[:200])
           b.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lowell-public-portal-access-test
          path: evidence/
          retention-days: 7
