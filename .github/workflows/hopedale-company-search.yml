name: Hopedale Giga Sunrun permit search
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/hopedale-company-search.yml']
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          pip -q install playwright
          python -m playwright install chromium
      - run: |
          python - <<'PY'
          import asyncio,json,re
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              pg=await b.new_page()
              await pg.goto('https://permiteyes.us/hopedale/publicview.php',wait_until='domcontentloaded')
              await pg.wait_for_timeout(3500)
              print('TABLES',await pg.locator('table').evaluate_all("es=>es.map(e=>({id:e.id,cl:e.className,rows:e.querySelectorAll('tbody tr').length}))"))
              inp=pg.locator('input[name=applicant_name]:visible').first
              for q in ['giga','sunrun','sun run','espigar','vivint']:
                await inp.fill(q)
                await inp.dispatch_event('keyup')
                await inp.press('Enter')
                await pg.wait_for_timeout(2600)
                rows=await pg.locator('tr:has(a.view_app)').evaluate_all("es=>es.map(e=>({cells:[...e.querySelectorAll('td')].map(x=>x.textContent.trim()),id:e.querySelector('a.view_app').dataset.id,attach:e.querySelector('a.Attachmentclass')?.title}))")
                print('RESULT',q,json.dumps(rows),flush=True)
                print('PAGINATION',await pg.locator('body').inner_text() if False else await pg.locator('.dataTables_info:visible').all_text_contents(),flush=True)
                for k in range(20):
                  nxt=pg.locator('.paginate_button.next:visible:not(.disabled)').first
                  if not await nxt.count():break
                  await nxt.click()
                  await pg.wait_for_timeout(1200)
                  rows=await pg.locator('tr:has(a.view_app)').evaluate_all("es=>es.map(e=>({cells:[...e.querySelectorAll('td')].map(x=>x.textContent.trim()),id:e.querySelector('a.view_app').dataset.id,attach:e.querySelector('a.Attachmentclass')?.title}))")
                  print('NEXT',q,json.dumps(rows),flush=True)
              await b.close()
          asyncio.run(main())
          PY
