name: 169 Katherine Road public original permits
on:
  push:
    branches: 
      - research/barnstable-laserfiche-20261122
    paths:
      - "tools/barnstable_laserfiche_probe.py"
      - ".github/workflows/barnstable-laserfiche.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check original property file and export public PDFs
        run: python -u tools/barnstable_laserfiche_probe.py
      - name: Preserve original PDF evidence and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 169-katherine-roof-sunrun-originals
          path: barnstable_169_katherine_originals/
          retention-days: 7
          if-no-files-found: warn
