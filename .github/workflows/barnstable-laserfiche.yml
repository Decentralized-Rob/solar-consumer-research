name: Barnstable public original permit PDF discovery
on:
  push:
    branches:
      - research/barnstable-laserfiche-20261122
    paths:
      - "tools/barnstable_laserfiche_probe.py"
      - ".github/workflows/barnstable-laserfiche.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe public property files and PDF links
        run: python -u tools/barnstable_laserfiche_probe.py
      - name: Preserve public discovery and original PDFs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barnstable-45-tevyaw-public-permit-research
          path: barnstable_45_tevyaw_packet/
          retention-days: 2
          if-no-files-found: warn
