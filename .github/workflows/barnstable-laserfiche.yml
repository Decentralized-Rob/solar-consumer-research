name: Barnstable roof-before-Sunrun permit match
on:
  push:
    branches:
      - research/barnstable-laserfiche-20261122
    paths:
      - "tools/barnstable_laserfiche_probe.py"
      - "tools/barnstable_sunrun_roof_pair_scan.py"
      - ".github/workflows/barnstable-laserfiche.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF search dependencies
        run: python -m pip install pymupdf requests
      - name: Match roof-before-Sunrun jobs from official town reports
        run: python -u tools/barnstable_sunrun_roof_pair_scan.py
      - name: Preserve public discovery and original PDFs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barnstable-sunrun-roof-permit-crossmatch
          path: barnstable_roof_before_sunrun/
          retention-days: 2
          if-no-files-found: warn
