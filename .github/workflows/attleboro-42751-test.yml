name: Attleboro permit 42751 attachment test
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/attleboro-42751-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: |
          pip -q install playwright pypdf
          python -m playwright install chromium
      - run: |
          mkdir -p output
          python - <<'PY'
          import asyncio,os,re,hashlib
          from playwright.async_api import async_playwright
          from pypdf import PdfReader
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              c=await b.new_context(accept_downloads=True)
              pg=await c.new_page()
              await pg.goto('https://permiteyes.us/attleboro/publicview.php',wait_until='domcontentloaded')
              await pg.wait_for_timeout(3500)
              inp=pg.locator('input[name=site_add]:visible,input[name=site_address]:visible').first
              await inp.fill('36 Don');await inp.dispatch_event('keyup');await inp.press('Enter')
              await pg.wait_for_timeout(2500)
              a=pg.locator('a.Attachmentclass[data-id="42751"]:visible').first
              await a.click(timeout=8000)
              m=pg.locator('#AttachmentModal')
              await m.locator('a[data-href][data-download]').first.wait_for(state='attached',timeout=8000)
              await pg.wait_for_timeout(1500)
              links=m.locator('a[data-href][data-download]:visible')
              names=await links.all_text_contents()
              print('FILES',names,flush=True)
              for i,name in enumerate(names):
                if not name.strip().lower().endswith('.pdf') or not re.search('contract|agreement|proposal|affidavit',name,re.I):continue
                async with pg.expect_download(timeout=12000) as d:await links.nth(i).click()
                dl=await d.value
                f='output/'+re.sub(r'[^a-zA-Z0-9._-]','_',dl.suggested_filename)
                await dl.save_as(f)
                data=open(f,'rb').read()
                assert data.startswith(b'%PDF-')
                print('VERIFIED',f,len(data),len(PdfReader(f).pages),hashlib.sha256(data).hexdigest(),flush=True)
              await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: attleboro-42751-public-pdfs
          path: output/
          if-no-files-found: error
