name: MassCEC Sunrun town crossmatch
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/masscec-sunrun.yml']
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - run: pip -q install openpyxl requests
      - run: |
          python - <<'PY'
          import requests,openpyxl,collections,re
          url='https://www.masscec.com/sites/default/files/documents/Solar-PV-Systems-in-MA-as-of-Jan-2025.xlsx'
          r=requests.get(url,timeout=90);r.raise_for_status();open('/tmp/data.xlsx','wb').write(r.content)
          w=openpyxl.load_workbook('/tmp/data.xlsx',read_only=True,data_only=True)
          towns='Adams|Ashfield|Attleboro|Becket|Bedford|Bellingham|Bernardston|Blandford|Braintree|Bridgewater|Buckland|Charlemont|Chelmsford|Chelsea|Cheshire|Chester|Chicopee|Cohasset|Concord|Conway|Dalton|Deerfield|Easthampton|Easton|Egremont|Erving|Fairhaven|Falmouth|Foxborough|Freetown|Gill|Great Barrington|Hanson|Hatfield|Hawley|Heath|Hingham|Hinsdale|Hopedale|Ipswich|Lanesborough|Lee|Lenox|Leverett|Leyden|Lincoln|Ludlow|Mansfield|Marion|Mashpee|Middleborough|Middlefield|Millis|Millville|Milton|Monterey|Montgomery|Mount Washington|North Reading|Northfield|Norwell|Otis|Palmer|Peru|Pittsfield|Randolph|Rehoboth|Richmond|Rockland|Rowe|Sandisfield|Sandwich|Savoy|Scituate|Sheffield|Shelburne|Shutesbury|Spencer|Stockbridge|Stoughton|Taunton|Wendell|West Bridgewater|West Tisbury|Westport|Whitman|Windsor'.split('|')
          def norm(s):
            s=re.sub('[^a-z]','',str(s).lower())
            return {'foxboro':'foxborough','middleboro':'middleborough','northattleboro':'northattleborough'}.get(s,s)
          counts=collections.Counter(); recent=collections.Counter(); total=0
          for s in w:
            print('SHEET',s.title,flush=True)
            rows=s.values
            for i,row in enumerate(rows):
              h=[str(x or '').lower().strip() for x in row]
              ins=next((j for j,x in enumerate(h) if 'installer' in x),None)
              city=next((j for j,x in enumerate(h) if x in ['city','town','municipality','project city','project town','system city','installation city']),None)
              date=next((j for j,x in enumerate(h) if 'date' in x and ('service' in x or 'install' in x)),None)
              if ins is not None and city is not None:
                print('HEADER',i,h,flush=True);break
              if i<10:print('ROW',i,h[:35],flush=True)
              if i>=20:break
            else:continue
            if ins is None or city is None:continue
            for row in rows:
              if re.search(r'sun\s*run',str(row[ins]),re.I):
                counts[norm(row[city])]+=1;total+=1
                if date is not None and getattr(row[date],'year',0)>=2022:recent[norm(row[city])]+=1
          print('TOTAL',total,flush=True)
          for t in sorted(towns,key=lambda t:-counts[norm(t)]):
            print('TOWN',t,counts[norm(t)],recent[norm(t)],flush=True)
          PY
