name: Easthampton original building PDF preflight
on:
  push:
    branches: [permit-test-hopedale-20261123]
    paths: ['.github/workflows/easthampton-pdf-test.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          pip -q install playwright pypdf
          python -m playwright install chromium
      - run: |
          mkdir -p output
          python - <<'PY'
          import asyncio,os,re,hashlib,json
          from playwright.async_api import async_playwright
          from pypdf import PdfReader
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch()
              c=await b.new_context(accept_downloads=True)
              pg=await c.new_page()
              await pg.goto('https://permiteyes.us/easthampton/publicview.php',wait_until='domcontentloaded',timeout=45000)
              await pg.wait_for_timeout(4500)
              rows=pg.locator('tr:has(a.Attachmentclass[title="Attachment(s) present"])')
              print('ATTACHED_ROWS',await rows.count(),flush=True)
              for i in range(min(await rows.count(),20)):
                row=rows.nth(i)
                record=await row.inner_text()
                if not re.search(r'building|roof|residential|construction|solar|alteration',record,re.I):continue
                print('RECORD',record,flush=True)
                await row.locator('a.Attachmentclass[title="Attachment(s) present"]').first.click(timeout=7000)
                m=pg.locator('#AttachmentModal')
                await pg.wait_for_timeout(1800)
                links=m.locator('a.downloadLink[data-size]:visible')
                print('FILES',await links.evaluate_all('es=>es.map(e=>({name:e.textContent,size:e.dataset.size}))'),flush=True)
                for j in range(min(await links.count(),10)):
                  l=links.nth(j)
                  name=(await l.inner_text()).strip()
                  if not name.lower().endswith('.pdf'):continue
                  try:
                    async with pg.expect_download(timeout=9000) as dl:
                      await l.click(timeout=5000)
                    d=await dl.value
                    f='output/'+re.sub(r'[^a-zA-Z0-9._-]','_',d.suggested_filename)
                    await d.save_as(f)
                    data=open(f,'rb').read()
                    assert data.startswith(b'%PDF-')
                    n=len(PdfReader(f).pages)
                    proof={'record':record,'filename':name,'bytes':len(data),'pages':n,'sha256':hashlib.sha256(data).hexdigest()}
                    print('VERIFIED',json.dumps(proof),flush=True)
                    open('output/proof.json','w').write(json.dumps(proof,indent=2))
                    await b.close()
                    return
                  except Exception as e:print('ERROR',str(e)[:200],flush=True)
                close=m.locator('button[data-dismiss=modal]:visible').first
                if await close.count():await close.click()
                await pg.wait_for_timeout(600)
              await b.close()
              raise RuntimeError('No original building attachment PDF verified')
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: easthampton-original-pdf
          path: output/
          if-no-files-found: ignore
